[package]
name = "klt-legalize-native"
version = "0.1.0"
edition = "2021"
description = "Native-Rust Abacus-style standard-cell row legalizer spike for `klt` (2AMLogic/klayout-tools, issue #784 -- Epic #700 Phase 1)"
license = "MIT"
publish = false

# Deliberately a plain `cargo test`/`cargo run` binary crate for this spike --
# no `pyo3`/`maturin` wiring yet (unlike `native/mom/`, the reference
# convention this crate otherwise follows: self-contained `Cargo.toml` at
# `native/<engine>/`, wired into the top-level build only once there is
# something to wire in). Issue #784 is explicitly go/no-go: adding the
# `pyo3`/`maturin`/CI-wiring surface before a "Go" verdict would be spending
# real maintenance surface on a result that might be "No-go". If this spike
# reports "Go", a follow-on issue adds the `pyo3` extension-module shape
# `native/mom/Cargo.toml`'s own comments document, without relocating this
# crate (already at the `native/<engine>/` path the eventual shape needs).

[[bin]]
name = "klt-legalize"
path = "src/main.rs"

[lib]
name = "klt_legalize_native"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
# Lets the CLI and its tests read the checked-in `.def.gz`/`.lef.gz` corpus
# fixtures (tests/corpus/legalize/) directly, without shelling out to `gzip`.
flate2 = "1"

[profile.release]
lto = true
# `debug = 1` is load-bearing on macOS, not a debugging nicety: cargo's default
# `debug = false` makes it pass `-C strip=debuginfo`, and on Apple `ld`
# PROJECT:ld-27037.1 that strip leaves a `LINKEDIT` string pool at an offset
# dyld rejects -- the Mach-O output links cleanly and dyld then refuses to load
# it ("mis-aligned LINKEDIT string pool"). Any nonzero `debug` suppresses the
# implicit strip. Diagnosed on `native/mom/`'s pyo3 extension, whose
# `Cargo.toml` carries the full bisection (issue #2261). This crate is the
# no-go legalizer spike -- `cargo test` builds under the test profile, so this
# release profile is effectively dead config here -- but its
# `[profile.release]` was byte-identical to mom's, and the override is applied
# uniformly across `native/` so the seven profiles do not silently diverge.
# Cost is local-artifact size only -- `publish = false`, never shipped.
debug = 1
