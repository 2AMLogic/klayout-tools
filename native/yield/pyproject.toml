[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "klt-yield-native"
version = "0.1.0"
description = "Compiled pyo3 extension backing `klt yield` (2AMLogic/klayout-tools): distribution fit, yield estimates with confidence intervals, Cpk, sample-size verdict. Install via `pip install 'klayout-tools[yield]'`."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://klayout-tools.org"
Source = "https://github.com/2AMLogic/klayout-tools/tree/main/native/yield"

[tool.maturin]
# The extension module Python imports as `klt_yield_native` (matches the
# crate's `[lib] name` in Cargo.toml).
module-name = "klt_yield_native"
features = ["pyo3/extension-module"]
