[package]
name = "klt-statime-native"
version = "0.1.0"
edition = "2021"
description = "Native-Rust gate-level static timing (NLDM) spike for `klt` (2AMLogic/klayout-tools, issue #809 -- Epic #704 Phase 1c)"
license = "MIT"
publish = false

# Issue #809 shipped this crate as a plain `cargo test`/`cargo run` binary --
# no `pyo3`/`maturin` wiring -- following `native/legalize/`'s precedent
# (issue #784) rather than `native/mom/`'s production shape, since #809 was
# explicitly go/no-go and adding the production-integration surface before
# the verdict was known would have spent real maintenance cost on a result
# that might have been "No-go". The verdict was "Go" (see README.md), and
# issue #925 (the follow-on integration issue README.md's own "Not in
# scope" section named) is what adds the `pyo3` extension-module shape
# below, matching `native/mom/Cargo.toml`'s own shape exactly. The
# `[[bin]]` target (the standalone `klt-statime` CLI `tests/corpus/statime/
# compare.py` still exercises) is unaffected -- both targets build from the
# same crate.

[[bin]]
name = "klt-statime"
path = "src/main.rs"

[lib]
# `cdylib` is required for pyo3's `extension-module`; `rlib` keeps the crate
# usable from `cargo test` and from the `klt-statime` binary above (a
# `cdylib`-only crate can't be linked as a normal Rust test/bin target) --
# mirrors `native/mom/Cargo.toml`'s own rationale exactly.
name = "klt_statime_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# pyo3 0.29 is the first line supporting Python 3.14 (see
# `native/mom/Cargo.toml` for the verified 0.22/0.23 rejection behavior this
# floor avoids). `extension-module` is deliberately NOT enabled here -- see
# `native/mom/Cargo.toml`'s own comment: it would make a plain `cargo test`/
# `cargo build --bin klt-statime` unlinkable. `pyproject.toml`'s
# `[tool.maturin] features` turns it on only for the `maturin build`/
# `develop` path.
pyo3 = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared bilinear-interpolation core, extracted (issue #2272) from this
# crate's own `nldm.rs` after `native/techmap` forked it verbatim and the
# two copies drifted. Path dependency, not published -- see
# `native/nldm-interp/Cargo.toml`.
klt-nldm-interp = { path = "../nldm-interp" }

[profile.release]
lto = true
# `debug = 1` is load-bearing on macOS, not a debugging nicety: cargo's default
# `debug = false` makes it pass `-C strip=debuginfo`, and on Apple `ld`
# PROJECT:ld-27037.1 that strip leaves a `LINKEDIT` string pool at an offset
# dyld rejects -- the Mach-O output links cleanly and dyld then refuses it
# ("mis-aligned LINKEDIT string pool"). Any nonzero `debug` suppresses the
# implicit strip. Diagnosed on `native/mom/`, whose `Cargo.toml` carries the
# full bisection (issue #2261); this crate's `[profile.release]` was
# byte-identical to mom's and its `klt_statime_native` extension is loaded
# through the same `dlopen` path (its standalone `klt-statime` binary through
# the same dyld), so the override is applied here too rather than waiting for
# the same trap to be rediscovered per crate. Cost is local-artifact size only
# -- `publish = false`, never shipped in a wheel.
debug = 1
