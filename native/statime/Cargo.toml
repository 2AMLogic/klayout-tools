[package]
name = "klt-statime-native"
version = "0.1.0"
edition = "2021"
description = "Native-Rust gate-level static timing (NLDM) spike for `klt` (2AMLogic/klayout-tools, issue #809 -- Epic #704 Phase 1c)"
license = "MIT"
publish = false

# Deliberately a plain `cargo test`/`cargo run` binary crate for this spike --
# no `pyo3`/`maturin` wiring, following `native/legalize/`'s precedent
# (issue #784) rather than `native/mom/`'s production shape. Issue #809 is
# explicitly go/no-go: adding the `pyo3`/`maturin`/CI-wiring surface before a
# verdict would spend real maintenance cost on a result that might be
# "No-go". If this spike reports "Go", a follow-on issue adds the `pyo3`
# extension-module shape `native/mom/Cargo.toml`'s own comments document,
# without relocating this crate (already at the `native/<engine>/` path the
# eventual shape needs). See README.md "Python<->Rust boundary" for the
# full deferred-integration story this issue asks to document explicitly.

[[bin]]
name = "klt-statime"
path = "src/main.rs"

[lib]
name = "klt_statime_native"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
