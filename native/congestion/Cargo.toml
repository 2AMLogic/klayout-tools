[package]
name = "klt-congestion-native"
version = "0.1.0"
edition = "2021"
description = "RUDY/RSMT-family post-placement congestion pre-check core for the fleet DSE loop (2AMLogic/klayout-tools, issue #785)"
license = "MIT"
publish = false

[lib]
# `cdylib` is required for pyo3's `extension-module`; `rlib` keeps the crate
# usable from `cargo test` (a `cdylib`-only crate can't be linked as a normal
# Rust test binary). Mirrors native/mom/Cargo.toml's own rationale.
name = "klt_congestion_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the same floor as native/mom (0.29 is the first line supporting
# Python 3.14 -- see that crate's Cargo.toml for the verified rejection
# behavior of 0.22/0.23 against a 3.14 interpreter).
pyo3 = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = true
