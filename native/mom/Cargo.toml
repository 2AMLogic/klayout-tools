[package]
name = "klt-mom-native"
version = "0.1.0"
edition = "2021"
description = "Method-of-Moments quasi-static capacitance + PEEC inductance/resistance solver core for `klt mom` (2AMLogic/klayout-tools)"
license = "MIT"
publish = false

[lib]
# `cdylib` is required for pyo3's `extension-module`; `rlib` keeps the crate
# usable from `cargo test` (a `cdylib`-only crate can't be linked as a normal
# Rust test binary).
name = "klt_mom_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# pyo3 0.29 is the first line supporting Python 3.14 (verified locally: 0.22
# and 0.23 both reject a 3.14 interpreter at build time with "the configured
# Python interpreter version (3.14) is newer than PyO3's maximum supported
# version"). Pinning to a version floor that already covers the newest
# interpreter avoids that failure mode recurring as CI/dev interpreters move
# forward.
#
# `extension-module` is deliberately NOT enabled here. That feature tells pyo3
# to leave Python's symbols unresolved for the interpreter to supply at import
# time, which is correct for the shipped `.so`/`.dylib` but makes a plain
# `cargo test` binary unlinkable ("symbol(s) not found ... _PyErr_SetObject").
# `native/mom/pyproject.toml`'s `[tool.maturin] features` turns it on for the
# maturin build only, so `cargo test` (which links libpython normally) and
# `maturin develop`/`maturin build` both work from the same manifest.
pyo3 = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dense LU solve for the potential-coefficient matrix. The MVP's conductor
# counts are small (a handful of conductors, at most a few hundred panels),
# so a single-threaded dense solve is more than adequate -- `rayon`-based
# parallel panel fill is a follow-up once conductor/panel counts grow enough
# to matter (see docs/cli/mom.md's "Performance" note).
nalgebra = "0.35"
# Complex arithmetic for the frequency-domain (retarded-kernel) full-wave
# solve (#893, Phase 2a of the MoM epic #701): partial impedance, propagation
# constant, and characteristic impedance are all genuinely complex-valued at
# nonzero frequency. Already resolved transitively via nalgebra's `simba`
# dependency (see Cargo.lock) -- declaring it directly here is not a new
# external dependency in practice, just naming what was already vendored.
num-complex = "0.4"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = true
# `debug = 1` (line tables only) is load-bearing, not a debugging nicety: with
# cargo's default `debug = false` for this profile, cargo implicitly passes
# `-C strip=debuginfo` to rustc, and on macOS (Apple `ld` PROJECT:ld-27037.1,
# Darwin 27.0.0 arm64) that strip leaves a `LINKEDIT` string pool at an offset
# dyld rejects. The resulting `.dylib` links cleanly but cannot be imported at
# all:
#
#   ImportError: dlopen(... klt_mom_native.cpython-312-darwin.so, 0x0002):
#     mis-aligned LINKEDIT string pool, fileOffset=0x0007D524
#
# Issue #2261 bisected it on that toolchain: the dev profile is fine,
# `maturin develop --release` is broken, `CARGO_PROFILE_RELEASE_LTO=false` does
# *not* help (so `lto` above is not the trigger), and
# `CARGO_PROFILE_RELEASE_DEBUG=true` does. Any nonzero `debug` suppresses the
# implicit strip -- verified with `cargo build --release -v`, which emits
# `-C strip=debuginfo` under `debug = 0` and `-C debuginfo=1` with no `-C strip`
# under `debug = 1`. `1` (line tables) is the cheapest value that does it.
#
# The cost is a bigger *local* build artifact and nothing else: these crates are
# `publish = false`, resolved from an in-repo path by `[tool.uv.sources]`, and
# never published to PyPI. Measured on Linux (x86_64, cargo 1.97.1):
# `target/release/libklt_mom_native.so` 0.79 MiB -> 7.67 MiB, and the
# maturin-installed `klt_mom_native...so` 0.64 MiB -> 3.44 MiB (maturin strips
# the packaged module itself, which is why the installed delta is the smaller
# of the two). An incremental release rebuild goes from ~4.3 s to ~4.8 s.
#
# Every sibling crate under `native/` carries the same override for the same
# reason -- see `native/README.md`'s "Release profile" section.
debug = 1
