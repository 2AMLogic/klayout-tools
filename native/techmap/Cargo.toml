[package]
name = "klt-techmap-native"
version = "0.1.0"
edition = "2021"
description = "Native-Rust Liberty-driven technology mapping for `klt` (2AMLogic/klayout-tools, issue #874 -- Epic #704 Phase 2b), against the contract issue #873 defines"
license = "MIT"
publish = false

# Deliberately a plain `cargo build`/`cargo test` binary crate -- no
# `pyo3`/`maturin` wiring, following `native/statime/`'s and
# `native/legalize/`'s precedent (issues #809/#784) rather than
# `native/mom/`'s production shape. Per
# `docs/design/synth-techmap-stage-contract.md` section 7 ("Where it
# lives"): this issue creates the crate and its own standalone CLI for
# corpus benchmarking; #875 (closed) wired the `klt equiv` acceptance gate
# in from the Python side (`klayout_tools.techmap.run_techmap`, invoking
# this binary as a subprocess) without changing this shape -- folding this
# crate into `klt synthesize`/a future `klt synth`, and a `pyo3`
# extension-module shape (`native/mom/Cargo.toml`'s own comments document
# that shape), remain open, deferred until a "Go" verdict warrants them.

[[bin]]
name = "klt-techmap"
path = "src/main.rs"

[lib]
name = "klt_techmap_native"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared bilinear-interpolation core, extracted (issue #2272) from
# `native/statime`'s own `nldm.rs` after this crate had forked it verbatim
# (issue #809's accepted spike) and the two copies drifted. Path
# dependency, not published -- see `native/nldm-interp/Cargo.toml`.
klt-nldm-interp = { path = "../nldm-interp" }

[profile.release]
lto = true
# `debug = 1` is load-bearing on macOS, not a debugging nicety: cargo's default
# `debug = false` makes it pass `-C strip=debuginfo`, and on Apple `ld`
# PROJECT:ld-27037.1 that strip leaves a `LINKEDIT` string pool at an offset
# dyld rejects -- the Mach-O output links cleanly and dyld then refuses to load
# it ("mis-aligned LINKEDIT string pool"). Any nonzero `debug` suppresses the
# implicit strip. Diagnosed on `native/mom/`'s pyo3 extension, whose
# `Cargo.toml` carries the full bisection (issue #2261). This crate builds a
# standalone binary rather than a `dlopen`ed extension, so it has not been
# observed failing -- but the defect is in the linker's strip pass, not in
# anything cdylib-specific, and its `[profile.release]` was byte-identical to
# mom's. The override is applied uniformly across `native/` so the seven
# profiles do not silently diverge. Cost is local-artifact size only --
# `publish = false`, never shipped in a wheel.
debug = 1
