[package]
name = "klt-techmap-native"
version = "0.1.0"
edition = "2021"
description = "Native-Rust Liberty-driven technology mapping for `klt` (2AMLogic/klayout-tools, issue #874 -- Epic #704 Phase 2b), against the contract issue #873 defines"
license = "MIT"
publish = false

# Deliberately a plain `cargo build`/`cargo test` binary crate -- no
# `pyo3`/`maturin` wiring, following `native/statime/`'s and
# `native/legalize/`'s precedent (issues #809/#784) rather than
# `native/mom/`'s production shape. Per
# `docs/design/synth-techmap-stage-contract.md` section 7 ("Where it
# lives"): this issue creates the crate and its own standalone CLI for
# corpus benchmarking; #875 (closed) wired the `klt equiv` acceptance gate
# in from the Python side (`klayout_tools.techmap.run_techmap`, invoking
# this binary as a subprocess) without changing this shape -- folding this
# crate into `klt synthesize`/a future `klt synth`, and a `pyo3`
# extension-module shape (`native/mom/Cargo.toml`'s own comments document
# that shape), remain open, deferred until a "Go" verdict warrants them.

[[bin]]
name = "klt-techmap"
path = "src/main.rs"

[lib]
name = "klt_techmap_native"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
