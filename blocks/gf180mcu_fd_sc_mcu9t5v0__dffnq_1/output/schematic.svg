<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520"
     role="img" aria-labelledby="title desc">
  <title id="title">gf180mcu_fd_sc_mcu9t5v0__dffnq_1 schematic</title>
  <desc id="desc">
    A D flip-flop (Q output only, no set/reset) built as a transmission-gate master-slave latch pair, structurally identical to the sky130 dfxtp_2 cell: a local clock buffer generates both clock phases (cki, ncki) from CLKN; D is inverted then passed through the master latch's transmission gate into a storage inverter with a clock-gated feedback keeper; a second transmission gate passes the master's output into an identical slave latch; the slave's output drives Q through a single-finger output inverter (no extra drive-strength folding, unlike dfxtp_2's doubled output stage). Presented as a functional block diagram, not a flat transistor net.
  </desc>
  <!--
    Theme-aware convention (matches site/README.md "Schematic section"):
    self-contained light/dark palette via `prefers-color-scheme`, since a
    staged SVG is loaded via <img> and cannot inherit host-page currentColor.
    Verified against gf180mcu_fd_sc_mcu9t5v0__dffnq_1.cdl (see provenance
    line in layout.json): 24 physical devices (12 N, 12 P), fully traced by
    gate/drain/source connectivity into the 10 functional blocks below (2
    CLK buffer + 2 D-input-INV + 2 TG1 + 2 master-storage-INV + 4
    master-feedback + 2 TG2 + 2 slave-storage-INV + 4 slave-feedback + 2
    output-driver = 24, 2 fewer than dfxtp_2 because the output driver is
    single-finger here). See issue #1123 PR body for the full trace.
  -->
  <style>
    .wire, .body { stroke: #1f2430; fill: none; stroke-width: 2; stroke-linecap: round; }
    .dot { fill: #1f2430; }
    .label { fill: #1f2430; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
    .label-sm { fill: #1f2430; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    .block { stroke: #1f2430; fill: none; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .wire, .body { stroke: #c6cdd6; }
      .dot { fill: #c6cdd6; }
      .label { fill: #c6cdd6; }
      .label-sm { fill: #c6cdd6; }
      .block { stroke: #c6cdd6; }
    }
  </style>

