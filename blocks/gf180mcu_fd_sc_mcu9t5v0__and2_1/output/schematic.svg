<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400"
     role="img" aria-labelledby="title desc">
  <title id="title">gf180mcu_fd_sc_mcu9t5v0__and2_1 schematic</title>
  <desc id="desc">
    A 2-input AND gate built as a NAND2 (two PMOS in parallel between VDD and node Z_neg, gated by A1/A2; two NMOS in series between Z_neg and VSS, A1 nearer Z_neg) followed by an output inverter (Z_neg -> Z). All 6 transistors are single-finger in the real layout, no folding, unlike the sky130 gallery cells.
  </desc>
  <!--
    Theme-aware convention (matches site/README.md "Schematic section"):
    self-contained light/dark palette via `prefers-color-scheme`, since a
    staged SVG is loaded via <img> and cannot inherit host-page currentColor.
    Verified against gf180mcu_fd_sc_mcu9t5v0__and2_1.cdl (see provenance
    line in layout.json): 6 physical devices (3 N, 3 P), 1:1 with this
    diagram: M_i_2/M_i_3 (NMOS series stack), M_i_4/M_i_5 (PMOS parallel),
    M_i_0/M_i_1 (output inverter). See issue #1123 PR body for the trace.
  -->
  <style>
    .wire, .body { stroke: #1f2430; fill: none; stroke-width: 2; stroke-linecap: round; }
    .dot { fill: #1f2430; }
    .label { fill: #1f2430; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
    .label-sm { fill: #1f2430; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    .block { stroke: #1f2430; fill: none; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .wire, .body { stroke: #c6cdd6; }
      .dot { fill: #c6cdd6; }
      .label { fill: #c6cdd6; }
      .label-sm { fill: #c6cdd6; }
      .block { stroke: #c6cdd6; }
    }
  </style>

