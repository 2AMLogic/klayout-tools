  <text class="label" x="348" y="185" text-anchor="start">Y</text>
  <line class="wire" x1="190" y1="180" x2="190" y2="215" />
  <line class="body" x1="190" y1="215" x2="190" y2="250" />
  <line class="wire" x1="190" y1="250" x2="190" y2="285" />
  <line class="body" x1="190" y1="285" x2="190" y2="320" />
  <line class="wire" x1="190" y1="320" x2="190" y2="350" />
  <text class="label-sm" x="205" y="235" text-anchor="start">MN_A (x2)</text>
  <text class="label-sm" x="205" y="305" text-anchor="start">MN_B (x2)</text>
  <line class="wire" x1="60" y1="215" x2="190" y2="215" />
