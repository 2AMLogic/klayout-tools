<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380"
     role="img" aria-labelledby="title desc">
  <title id="title">sky130_fd_sc_hd__buf_4 schematic</title>
  <desc id="desc">
    A non-inverting buffer built from two CMOS inverters in series: a minimum-size first stage (INV1, driven by A) feeding a second, drive-boosted stage (INV2, driving output X). The real layout folds INV2's transistors into 4 parallel fingers each for extra drive strength (10 physical devices total: 1+1 for INV1, 4+4 for INV2); this diagram shows the 2-inverter logical topology.
  </desc>
  <!--
    Theme-aware convention (matches site/README.md "Schematic section"):
    self-contained light/dark palette via `prefers-color-scheme`, since a
    staged SVG is loaded via <img> and cannot inherit host-page currentColor.
    Verified against sky130_fd_sc_hd__buf_4.spice (see provenance line in
    layout.json) — 10 physical devices (5 N, 5 P): INV1 (X5/X7, single
    finger) drives node a_27_47#, INV2 (X0/X1/X2/X3 N, X4/X6/X8/X9 P, each
    folded x4) drives X. See issue #1123 PR body for the full trace.
  -->
  <style>
    .wire, .body { stroke: #1f2430; fill: none; stroke-width: 2; stroke-linecap: round; }
    .dot { fill: #1f2430; }
    .label { fill: #1f2430; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
    .label-sm { fill: #1f2430; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    .block { stroke: #1f2430; fill: none; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .wire, .body { stroke: #c6cdd6; }
      .dot { fill: #c6cdd6; }
      .label { fill: #c6cdd6; }
      .label-sm { fill: #c6cdd6; }
      .block { stroke: #c6cdd6; }
    }
  </style>

