    { name = "klt-statime-native" },
]
yield = [
    { name = "klt-yield-native" },
]

[package.metadata]
requires-dist = [
    { name = "cocotb", marker = "python_full_version < '3.14' and extra == 'functional-verification'", specifier = ">=2.0.1,<2.1" },
    { name = "jsonschema", specifier = ">=4.0" },
    { name = "klayout", specifier = ">=0.30" },
    { name = "pynec", marker = "python_full_version >= '3.11' and extra == 'mom-cross-validation'", specifier = ">=2.3,<3" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.14" },
]
provides-extras = ["dev", "functional-verification", "mom-cross-validation"]

[package.metadata.requires-dev]
congestion = [{ name = "klt-congestion-native", directory = "native/congestion" }]
mom = [{ name = "klt-mom-native", directory = "native/mom" }]
statime = [{ name = "klt-statime-native", directory = "native/statime" }]
