[project]
name = "klayout-tools"
# The version is computed at build time from `[tool.hatch.version]`'s
# `base-version` plus the checkout's git facts (issue #2823) -- see that
# table below.
dynamic = ["version"]
description = "Tools for AI agents to work with IC layout (GDSII/OASIS via KLayout)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "2AM Logic", email = "robb@2amlogic.com" }]
requires-python = ">=3.10"
dependencies = [
    # 0.30 floor: `klt extract --parasitics` reads per-net/per-layer geometry
    # via `LayoutToNetlist.polygons_of_net(net, layer_index)`, whose
    # layer-index form was introduced in KLayout 0.30 (issue #217).
    # Deliberately a floor, not an exact pin -- a hard `klayout==X.Y.Z` would
    # break installs on any point release this project's own deck test
    # suite has never exercised. `uv.lock`'s own pinned `klayout` entry (what
    # CI actually tests against, via `uv sync --locked`) is surfaced instead
    # as `klt version --format json`'s `klayout_version_expected` and
    # `klt drc`/`klt lvs`'s `provenance.klayout_version_mismatch` (issue
    # #1490) -- see `docs/design/klayout-engine-version-pin.md`.
    "klayout>=0.30",
    # Backs `klt kb validate` (src/klayout_tools/kb.py), so it's a runtime
    # dependency, not dev-only -- it was dev-only before that command existed.
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://klayout-tools.org"
Repository = "https://github.com/2AMLogic/klayout-tools"

[project.scripts]
klt = "klayout_tools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    # Type-check ratchet (issue #3221): scripts/check_type_baseline.py.
    # Pinned to a major so diagnostics (and thus type-baseline.json) stay
    # stable between releases.
    "mypy>=2.4,<3",
    # Lets tests/test_mcp_server.py run its stdio round-trip in CI. Dev-only:
    # the test importorskip()s `mcp`, so the suite also passes without it.
    "mcp>=2.0,<3",
]
# Backs `klt mcp serve` (issue #2830): the stdio MCP bridge over the verb
# registry. Optional so the base install gains no dependency.
mcp = [
    "mcp>=2.0,<3",
]
# Backs the `klt functional-verification` verb (issue #422, epic #391). Its own
# extra: not a runtime dependency of any shipped `klt` command.
#
# Before widening this pin past `<2.2`, re-run the Python 3.14 measurement
# (`uv sync --locked --python 3.14 --extra dev --extra functional-verification`)
# and check the CI `test` matrix covers every interpreter `requires-python`
# claims. If a cocotb line reintroduces a ceiling (its PyPI metadata declares no
# upper bound), restore a `python_version` marker plus a guard in the verb
# (history: issues #423, #2583, #2593).
functional-verification = [
    "cocotb>=2.1.0,<2.2",
]
# `yield` (issue #2531, operator ruling 2026-10-02): the prebuilt
# `klt_yield_native` wheel behind `klt yield`/`yield-campaign`/
# `yield-sensitivity`, published to PyPI as its own package `klt-yield-native`
# by `.github/workflows/publish-native.yml` (Linux x86_64 + macOS arm64; see
# docs/releasing-native.md). `pip install 'klayout-tools[yield]'` therefore
# needs no Rust toolchain on those platforms.
#
# Release ordering: `klt-yield-native` MUST be on PyPI before a klayout-tools
# release carrying this extra is published, otherwise `[yield]` fails with "no
# matching distribution" (the base install is unaffected -- an extra's
# requirements are only resolved when it is requested). The floor/ceiling pin
# below tracks the 0.1.x wheel line; bump it when the extension's Python-visible
# API changes. In a checkout, `[tool.uv.sources]` below still resolves the name
# from `native/yield/`, so `uv sync --extra yield` builds from source.
# The same-named `yield` dependency group further down stays for CI's
# from-source build (`uv sync --group yield`, which must exercise the checkout's
# own Rust source, never a published wheel). The other three Rust crates remain
# dependency groups until each is asked for (same recipe).
yield = [
    "klt-yield-native>=0.1.0,<0.2",
]
# Backs `tests/test_mom_cross_validation.py` (issue #895, Phase 2c of the
# Method-of-Moments epic #701): the external MoM oracle used to cross-check
# `klt mom`'s full-wave S-parameters ("Cross-check against an external
# MoM/FEM ... on a shared benchmark", the epic's own Phase 0
# reality-grounding requirement). `PyNEC` wraps nec2++/NEC2 -- a mature,
# independently-developed thin-wire Method-of-Moments antenna/transmission-
# line solver (Lawrence Livermore's original NEC2, ported to C++), a
# genuinely different codebase/discretisation from `klt_mom_native`'s Rust
# implementation. It is its own extra, never pulled in by `dev`, for two
# reasons:
#   1. License: `PyNEC`'s own PyPI metadata declares `GPL-3.0-only` -- the
#      same category `docs/design/em-field-sim-spike.md` already flags for
#      openEMS ("fine to invoke as a subprocess, forecloses in-process/
#      library embedding inside this repo's MIT surface"). `klt mom` itself
#      never imports it; only `scripts/mom_nec_reference.py` does, and that
#      script is always invoked as its own subprocess by the cross-
#      validation test -- see that script's module docs for the full
#      rationale. Kept as an installable extra (not a `[tool.uv.sources]`
#      path dependency like the `mom`/`congestion`/`yield` groups above)
#      because -- unlike those in-repo Rust crates -- `PyNEC` is a real
#      published PyPI package with no in-repo source of its own.
#   2. `python_version >= "3.11"` mirrors `PyNEC`'s own declared
#      `Requires-Python` floor (verified against its PyPI metadata) --
#      without the marker, `uv sync --extra mom-cross-validation` on this
#      repo's own 3.10 floor (`requires-python` above) would fail to
#      resolve; the cross-validation test instead skips cleanly on 3.10 with
#      a clear reason (see that test module's own skip logic).
mom-cross-validation = [
    "PyNEC>=2.3,<3; python_version >= \"3.11\"",
]
# Backs `tests/test_mom_pypeec_cross_validation.py` (issue #1886, closing out
# #1842's acceptance criterion 3): the external PEEC oracle used to cross-check
# `klt mom`'s *spiral* partial-inductance sum. `pypeec` (Dartmouth College,
# MPL-2.0, JOSS 10.21105/joss.06644) is a 3-D quasi-magnetostatic PEEC solver
# with an FFT-accelerated dense operator -- the same method class as
# `native/mom/src/peec.rs` and as FastHenry, but an entirely independent
# implementation.
#
# It is its own extra, separate from `mom-cross-validation` above, for two
# reasons:
#   1. Different oracle, different gap. `mom-cross-validation` installs
#      `PyNEC` for the *full-wave S-parameter* cross-check (#895) and is
#      gated on Python >=3.11 by `PyNEC`'s own floor; this one installs
#      `pypeec` for the *PEEC inductance* cross-check and has no such gate
#      (`pypeec` declares `Requires-Python: >=3.10`, matching this repo's own
#      floor). Keeping them separate means a failure in either CI step
#      attributes to exactly one oracle.
#   2. Weight. `pypeec`'s declared dependencies include its plotting/GUI
#      stack (`vtk`, `pyvista`, `pyside6`) with no extras to opt out of, so
#      installing it is ~1.6 GB. That is fine for one opt-in CI step and
#      unacceptable in anything a plain `pip install klayout-tools` or
#      `uv sync --extra dev` resolves -- neither of which touches this extra.
#
# License handling is the same subprocess-only discipline `PyNEC` gets (see
# `docs/design/mom-cross-validation.md`'s "License" section): MPL-2.0 is
# file-scoped weak copyleft rather than GPL, so the constraint is weaker, but
# `klt mom` and everything under `src/` still never import `pypeec` -- only
# `scripts/mom_pypeec_reference.py` does, always as its own subprocess.
mom-pypeec-cross-validation = [
    "pypeec>=5.8,<6",
]

# Checkout-local Rust (pyo3) extensions, built from `native/<name>/` via
# `[tool.uv.sources]` below. They are dependency groups, not extras, for two
# reasons:
#   1. Building needs a `cargo` toolchain that a plain
#      `pip install klayout-tools` cannot assume; each verb fails cleanly with a
#      build pointer when its extension is absent (e.g. docs/cli/mom.md).
#   2. They resolve from in-repo paths, so an extra would publish a package
#      into the wheel metadata that does not exist on PyPI. Groups never land
#      in published metadata.
#
# - `mom`: `klt_mom_native` backing `klt mom` (issue #718, epic #701).
# - `congestion`: `klt_congestion_native`, FLUTE/RUDY post-placement
#   congestion research spike (issue #785); no shipped `klt` verb.
# - `yield`: `klt_yield_native` backing `klt yield` (issue #816, epic #710).
# - `statime`: `klt_statime_native` backing `klt synthesize`'s `sta` report
#   (issues #809/#925); the field degrades to `null` when absent.
[dependency-groups]
mom = [
    "klt-mom-native",
]
congestion = [
    "klt-congestion-native",
]
# Checkout-local from-source build of the same crate that the `yield` *extra*
# above installs prebuilt from PyPI (issue #2531); CI uses this group so the
# tests run against the checkout's Rust source.
yield = [
    "klt-yield-native",
]
statime = [
    "klt-statime-native",
]
# `numerical` (issue #2276): numpy as a *test-only* cross-check oracle for the
# pure-Python numerical code (`ir_solver.py`, `sim.py` Monte Carlo statistics),
# used by `tests/test_ir_solver_numpy_crosscheck.py` and the `test-numerical` CI
# job. Not a runtime dependency; the tests skip without it
# (docs/guides/dependency-gated-ci.md).
#
# `>=2.2` with no upper cap: 2.2.x is the newest line that resolves on Python
# 3.10, and capping at `<2.3` would force a downgrade of the numpy that
# PyNEC's `mom-cross-validation` extra already resolves in `uv.lock`.
numerical = [
    "numpy>=2.2",
]

[tool.uv]
# The editable install's metadata version is computed from git facts (issue
# #2823, `[tool.hatch.version]` below), so uv must rebuild it when the commit
# or tags move -- not only when pyproject.toml changes (uv's default key).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
klt-mom-native = { path = "native/mom" }
klt-congestion-native = { path = "native/congestion" }
klt-yield-native = { path = "native/yield" }
klt-statime-native = { path = "native/statime" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klayout_tools"]

# `klt signoff --manifest`/`--fleet` parse `docs/design-evidence-tiers.md` at
# runtime (see src/klayout_tools/design_evidence_tiers.py), so the doc is
# runtime tool data, not just prose: bundle it *inside* the package so a wheel
# install (`pip install`, `uv tool install`) can find it with no source
# checkout and no sibling `docs/` directory (issue #1050). The destination
# must stay in sync with `_PACKAGED_DOC_PATH` in that module -- a test
# asserts the two agree. (Note this is deliberately unlike `kb/`, which
# `kb.py` documents as a repo-checkout corpus intentionally left out of the
# wheel.)
[tool.hatch.build.targets.wheel.force-include]
"docs/design-evidence-tiers.md" = "klayout_tools/data/design-evidence-tiers.md"

# Distribution version (issue #2823). `base-version` is the release this
# checkout is at or working towards -- bump it here (then `uv lock`) when
# cutting a release, see RELEASING.md. The version a wheel/sdist actually
# declares is computed by `hatch_build.py`'s version source from it plus the
# checkout's git facts (`src/klayout_tools/_version_scheme.py`):
#   clean tree exactly on tag vX.Y.Z  -> X.Y.Z
#   after the released tag            -> X.Y.(Z+1).devN+g<sha>[.dirty]
#   before the base is tagged         -> X.Y.Z.devN+g<sha>[.dirty]
#   no git facts at all               -> X.Y.Z.dev0+unknown
# Only the first is the bare public version, so a resolver can never satisfy
# `klayout-tools==X.Y.Z` with a post-tag/dirty/unknown build -- the previous
# static `version` let a cached dev build masquerade as the release.
#
# Hatchling has no `custom` version-source plugin, so the built-in `code`
# source loads `hatch_build.py` by path and evaluates the expression below;
# `version_from_pyproject()` reads `base-version` back out of this table.
[tool.hatch.version]
source = "code"
path = "hatch_build.py"
expression = "version_from_pyproject()"
base-version = "0.7.0"

# Build identity (issue #1202). `hatch_build.py` records the commit/tag/dirty
# state of the checkout each distribution is built from (plus the version the
# version source above chose) into a generated `klayout_tools/_build_info.py`,
# so `klt version` can report the git facts behind the version, and a wheel
# rebuilt from the sdist (no `.git`) keeps the originating version. Policy
# (what counts as a release) lives in `src/klayout_tools/build_identity.py`
# and `_version_scheme.py`; the hook only records facts.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Baseline-ratchet type check (issue #3221); see scripts/check_type_baseline.py
# and docs/type-checking.md. Not `strict`: the baseline records today's
# diagnostics and the ratchet only blocks new ones.
files = ["src"]
python_version = "3.10"
ignore_missing_imports = false
show_error_codes = true
show_column_numbers = true
pretty = false

# KLayout's Python bindings ship no usable type information.
[[tool.mypy.overrides]]
module = ["pya", "pya.*", "klayout", "klayout.*"]
ignore_missing_imports = true

# Stricter bar for the JSON-contract envelope modules: they must stay fully
# annotated (and are why `src/klayout_tools/py.typed` ships, issue #3221).
[[tool.mypy.overrides]]
module = ["klayout_tools.cli.output", "klayout_tools.signoff_envelopes"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Optional-extra / stub-less third parties that are legitimately absent or
# untyped in the dev environment (cocotb is the `functional-verification`
# extra; jsonschema ships no inline types). Without this they would surface
# as import-not-found / import-untyped, which the ratchet refuses to baseline.
[[tool.mypy.overrides]]
module = ["cocotb", "cocotb.*", "cocotb_tools", "cocotb_tools.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# `.loom/`, `.claude/`, and `.agents/` are vendored agent-tooling trees (Loom +
# Claude skills + repo-skills' agent-portable mirror, added by repo-skills
# 0.11.2) that this repo does not own and re-syncs from upstream -- linting,
# formatting, or complexity-scanning them would churn (or outright break CI,
# issue #2663) on every upstream bump. No tree contains any first-party
# Python. `_vendor/mutation_variants.py` is a byte-exact third-party port (see
# the matching `per-file-ignores` entry below) -- excluded here too, so `ruff`
# never reflows it away from the origin file it must stay diffable against.
# Top-level `exclude` is inherited by both `[tool.ruff.lint]` (including the
# `scripts/check_complexity_baseline.py` C901 scan, which shells out to plain
# `ruff check`) and `[tool.ruff.format]` unless a sub-table overrides it, so
# declaring it once here scopes every ruff-driven gate to code we own.
exclude = [
    ".loom/**",
    ".claude/**",
    ".agents/**",
    "src/klayout_tools/_vendor/mutation_variants.py",
]

[tool.ruff.format]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    # flake8-bandit: explicit high-signal subset (NOT blanket "S"). S101
    # (assert), S603/S607 (subprocess by design) and S105 (false-positive
    # "password" strings) stay off as pure noise (issue #3222).
    "S102",  # exec
    "S108",  # hardcoded /tmp
    "S202",  # tarfile extractall
    "S301",  # pickle
    "S307",  # eval
    "S310",  # urlopen scheme
    "S314",  # stdlib xml parsing
    "S324",  # weak hashes
    "S506",  # unsafe yaml load
    "S602",  # subprocess shell=True
    "S604",  # shell=True call
    "S605",  # os.system-style shell
]

[tool.ruff.lint.mccabe]
# Cyclomatic-complexity ratchet, not a ceiling (issue #2034, decomposed from
# #2011 item 3). `C901` is deliberately NOT in `[tool.ruff.lint]`'s `select`
# list above -- adding it there would make plain `ruff check .` fail
# outright on every function already over this threshold (167, measured
# 2026-09-18 -- a snapshot, re-measure rather than trust this number),
# which is exactly the "ceiling that blocks landing on pre-existing debt"
# the issue argues against. This `max-complexity` value is instead the
# target `scripts/check_complexity_baseline.py` enforces as its own
# dedicated CI step: any function not listed in the committed
# `complexity-baseline.json` must stay at or under this value, and any
# baselined function must not get *more* complex than its recorded value
# (getting less complex, or disappearing, never fails). See that script's
# module docstring for the full mechanism, and
# `tests/test_check_complexity_baseline.py` for the drift guard that keeps
# this value and the script's own `MAX_COMPLEXITY` constant in sync.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Byte-exact ports of third-party source (docs/design/mutation-testing-spike.md,
# "Attribution mechanics"; `src/klayout_tools/_vendor/__init__.py`'s own "port,
# don't fork silently" rule) keep the upstream file's own line breaks so a
# reviewer can diff against the origin unmodified -- reflowing them to satisfy
# this repo's 88-column style would itself be an undisclosed change.
"src/klayout_tools/_vendor/mutation_variants.py" = ["E501"]
# Security rules (issue #3222) target shipped code. Tests, examples and research
# scripts parse repo-controlled/just-built files and use throwaway "/tmp/..."
# string fixtures that are never opened, so S108/S314/S202 are pure noise there.
"tests/**" = ["S108", "S202", "S314"]
"examples/**" = ["S108", "S314"]
"scripts/**" = ["S108", "S314"]
