[project]
name = "klayout-tools"
version = "0.0.1"
description = "Tools for AI agents to work with IC layout (GDSII/OASIS via KLayout)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "2AM Logic", email = "robb@2amlogic.com" }]
requires-python = ">=3.10"
dependencies = [
    "klayout>=0.29",
]

[project.urls]
Homepage = "https://klayout-tools.org"
Repository = "https://github.com/2AMLogic/klayout-tools"

[project.scripts]
klt = "klayout_tools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klayout_tools"]
