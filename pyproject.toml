[project]
name = "klayout-tools"
version = "0.5.0"
description = "Tools for AI agents to work with IC layout (GDSII/OASIS via KLayout)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "2AM Logic", email = "robb@2amlogic.com" }]
requires-python = ">=3.10"
dependencies = [
    # 0.30 floor: `klt extract --parasitics` reads per-net/per-layer geometry
    # via `LayoutToNetlist.polygons_of_net(net, layer_index)`, whose
    # layer-index form was introduced in KLayout 0.30 (issue #217).
    # Deliberately a floor, not an exact pin -- a hard `klayout==X.Y.Z` would
    # break installs on any point release this project's own deck test
    # suite has never exercised. `uv.lock`'s own pinned `klayout` entry (what
    # CI actually tests against, via `uv sync --locked`) is surfaced instead
    # as `klt version --format json`'s `klayout_version_expected` and
    # `klt drc`/`klt lvs`'s `provenance.klayout_version_mismatch` (issue
    # #1490) -- see `docs/design/klayout-engine-version-pin.md`.
    "klayout>=0.30",
    # Backs `klt kb validate` (src/klayout_tools/kb.py), so it's a runtime
    # dependency, not dev-only -- it was dev-only before that command existed.
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://klayout-tools.org"
Repository = "https://github.com/2AMLogic/klayout-tools"

[project.scripts]
klt = "klayout_tools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]
# Backs the future `klt functional-verification` verb (issue #422, Phase 3
# of Epic #391) -- not a runtime dependency of any shipped `klt` command
# yet, so it is its own extra rather than folded into `dependencies` or
# `dev`. Pinned per docs/design/cocotb-verification-spike.md's finding
# (issue #423): cocotb 2.0.1's own PyPI metadata declares
# `Requires-Python: >=3.6.2` with **no upper bound** (verified against
# PyPI's JSON API), so pip/uv's resolver has no signal that Python 3.14 is
# unsupported -- `pip install cocotb` under a 3.14 interpreter proceeds to
# build the package, then fails with cocotb's own internal check:
# `RuntimeError: cocotb 2.0.1 only supports a maximum Python version of
# 3.13` (verified live). The `python_version < "3.14"` marker below moves
# that failure to dependency-*resolution* time -- the standard, idiomatic
# way pip/uv already handle a package with no distributable release for a
# given interpreter -- rather than a confusing traceback surfacing from deep
# inside cocotb's own build backend. Lift this cap once a cocotb release
# adds Python 3.14 support (track https://github.com/cocotb/cocotb); until
# then a `functional-verification` install attempt on 3.14 simply omits
# cocotb from the resolved set, and any code that needs it must raise its
# own clear "functional-verification requires Python < 3.14" error before
# calling into it (the verb issue's concern, not this pin's).
functional-verification = [
    "cocotb>=2.0.1,<2.1; python_version < \"3.14\"",
]
# Backs `tests/test_mom_cross_validation.py` (issue #895, Phase 2c of the
# Method-of-Moments epic #701): the external MoM oracle used to cross-check
# `klt mom`'s full-wave S-parameters ("Cross-check against an external
# MoM/FEM ... on a shared benchmark", the epic's own Phase 0
# reality-grounding requirement). `PyNEC` wraps nec2++/NEC2 -- a mature,
# independently-developed thin-wire Method-of-Moments antenna/transmission-
# line solver (Lawrence Livermore's original NEC2, ported to C++), a
# genuinely different codebase/discretisation from `klt_mom_native`'s Rust
# implementation. It is its own extra, never pulled in by `dev`, for two
# reasons:
#   1. License: `PyNEC`'s own PyPI metadata declares `GPL-3.0-only` -- the
#      same category `docs/design/em-field-sim-spike.md` already flags for
#      openEMS ("fine to invoke as a subprocess, forecloses in-process/
#      library embedding inside this repo's MIT surface"). `klt mom` itself
#      never imports it; only `scripts/mom_nec_reference.py` does, and that
#      script is always invoked as its own subprocess by the cross-
#      validation test -- see that script's module docs for the full
#      rationale. Kept as an installable extra (not a `[tool.uv.sources]`
#      path dependency like the `mom`/`congestion`/`yield` groups above)
#      because -- unlike those in-repo Rust crates -- `PyNEC` is a real
#      published PyPI package with no in-repo source of its own.
#   2. `python_version >= "3.11"` mirrors `PyNEC`'s own declared
#      `Requires-Python` floor (verified against its PyPI metadata) --
#      without the marker, `uv sync --extra mom-cross-validation` on this
#      repo's own 3.10 floor (`requires-python` above) would fail to
#      resolve; the cross-validation test instead skips cleanly on 3.10 with
#      a clear reason (see that test module's own skip logic).
mom-cross-validation = [
    "PyNEC>=2.3,<3; python_version >= \"3.11\"",
]
# Backs `tests/test_mom_pypeec_cross_validation.py` (issue #1886, closing out
# #1842's acceptance criterion 3): the external PEEC oracle used to cross-check
# `klt mom`'s *spiral* partial-inductance sum. `pypeec` (Dartmouth College,
# MPL-2.0, JOSS 10.21105/joss.06644) is a 3-D quasi-magnetostatic PEEC solver
# with an FFT-accelerated dense operator -- the same method class as
# `native/mom/src/peec.rs` and as FastHenry, but an entirely independent
# implementation.
#
# It is its own extra, separate from `mom-cross-validation` above, for two
# reasons:
#   1. Different oracle, different gap. `mom-cross-validation` installs
#      `PyNEC` for the *full-wave S-parameter* cross-check (#895) and is
#      gated on Python >=3.11 by `PyNEC`'s own floor; this one installs
#      `pypeec` for the *PEEC inductance* cross-check and has no such gate
#      (`pypeec` declares `Requires-Python: >=3.10`, matching this repo's own
#      floor). Keeping them separate means a failure in either CI step
#      attributes to exactly one oracle.
#   2. Weight. `pypeec`'s declared dependencies include its plotting/GUI
#      stack (`vtk`, `pyvista`, `pyside6`) with no extras to opt out of, so
#      installing it is ~1.6 GB. That is fine for one opt-in CI step and
#      unacceptable in anything a plain `pip install klayout-tools` or
#      `uv sync --extra dev` resolves -- neither of which touches this extra.
#
# License handling is the same subprocess-only discipline `PyNEC` gets (see
# `docs/design/mom-cross-validation.md`'s "License" section): MPL-2.0 is
# file-scoped weak copyleft rather than GPL, so the constraint is weaker, but
# `klt mom` and everything under `src/` still never import `pypeec` -- only
# `scripts/mom_pypeec_reference.py` does, always as its own subprocess.
mom-pypeec-cross-validation = [
    "pypeec>=5.8,<6",
]

# Backs `klt mom` (issue #718, Phase 0/1 of the Method-of-Moments epic #701):
# the `klt_mom_native` pyo3 extension whose crate lives in `native/mom/`, this
# repo's first Rust component.
#
# It is a PEP 735 **dependency group**, not a `[project.optional-dependencies]`
# extra, on purpose. Two reasons:
#   1. Building it needs a Rust toolchain (`cargo`) that a plain
#      `pip install klayout-tools` cannot assume -- every other `klt` verb must
#      stay installable with no Rust in sight, and `klt mom` fails cleanly with
#      a build pointer when the extension is absent (see docs/cli/mom.md).
#   2. It resolves from an in-repo path (`[tool.uv.sources]` below), so it only
#      exists in a checkout. An extra would publish `klt-mom-native` into the
#      wheel's own metadata, and `pip install klayout-tools[mom]` from PyPI
#      would then fail with "no matching distribution" -- there is no such
#      package on PyPI. Dependency groups are checkout-local by design and
#      never land in published metadata.
#
# `native/congestion/` (issue #785, Epic #700 Phase 1 §3.6 of
# `docs/design/place-and-route-improvements-survey.md`): the
# `klt_congestion_native` pyo3 extension backing the FLUTE/RUDY-family
# post-placement congestion pre-check research spike. Same two reasons as
# `mom` above (optional Rust toolchain, in-repo-only path source) -- this is
# a research/library component, not a shipped `klt` CLI verb, so it is
# likewise a dependency group rather than an installable extra.
#
# `native/yield/` (issue #816, Phase 1a of the statistical/yield epic #710):
# the `klt_yield_native` pyo3 extension backing `klt yield`'s statistics core
# (distribution fit, exact + parametric yield estimates with confidence
# intervals, Cp/Cpk, sample-size verdict). Same two reasons as `mom` above --
# an optional Rust toolchain and an in-repo-only path source -- so `klt yield`
# likewise fails cleanly with a build pointer when the extension is absent
# (see docs/cli/yield.md).
#
# `native/statime/` (issue #809, promoted from a plain-binary spike to a
# production pyo3 extension by issue #925, Epic #704 Phase 3): the
# `klt_statime_native` extension backing `klt synthesize`'s integrated `sta`
# critical-path report. Same two reasons as `mom` above -- an optional Rust
# toolchain and an in-repo-only path source -- so `klt synthesize`'s `sta`
# field degrades to `null` (never a hard failure) when the extension is
# absent, per `klayout_tools/sta.py`'s own docstring.
[dependency-groups]
mom = [
    "klt-mom-native",
]
congestion = [
    "klt-congestion-native",
]
yield = [
    "klt-yield-native",
]
statime = [
    "klt-statime-native",
]
# `numerical` (issue #2276): the full-strength numerical-oracle surface --
# numpy as a *test-only* cross-check oracle for this repo's pure-Python
# numerical code (the conjugate-gradient IR solver behind `klt power`,
# `src/klayout_tools/ir_solver.py`, and `sim.py`'s Monte Carlo statistics).
# It is NOT a runtime dependency and does not move the contract that
# docstring itself states ("No numpy/scipy: klayout-tools's runtime
# dependency set is deliberately just klayout/jsonschema"): nothing under
# `src/klayout_tools/` imports numpy, and a PEP 735 dependency group is
# never installed by a plain `pip install klayout-tools` -- it exists only
# for checkouts that ask for it (`uv sync --group numerical`), same
# checkout-local reasoning as the four Rust groups above.
#
# A dependency *group*, not a `[project.optional-dependencies]` extra,
# on purpose: an extra advertises itself to end users installing the
# package (`pip install klayout-tools[numerical]` would land in the wheel's
# published metadata), while this oracle exists solely for this repo's own
# cross-check suite (`tests/test_ir_solver_numpy_crosscheck.py`) and its
# dedicated CI job (`test-numerical` in .github/workflows/ci.yml).
# Everywhere numpy's absence is the *declared* state -- the test module
# skips itself wholesale via `pytest.importorskip("numpy")`, and a
# stdlib-only host is expected to see exactly that skip, never a failure
# and never a silent false-pass. See
# docs/guides/dependency-gated-ci.md for the full skip/refuse/fail
# convention this group exists to serve.
#
# `>=2.2` with deliberately no upper cap. numpy 2.3 dropped Python 3.10
# (this repo's `requires-python` floor), so 2.2.x is the newest line that
# still resolves across the whole supported range 3.10-3.13 -- but capping
# at `<2.3` would reach into the one place numpy already resolves in
# `uv.lock` today (PyNEC's transitive dependency for the `mom-cross-
# validation` extra: 2.4.6 on 3.11, 2.5.2 on >=3.12) and silently force a
# downgrade there. The uncapped floor instead lets the universal lock keep
# its per-interpreter markers exactly as they are: 2.2.x on 3.10 (where
# this group is the only requester) and the existing 2.4.6/2.5.2 on 3.11+,
# unchanged for every surface that already synced numpy.
numerical = [
    "numpy>=2.2",
]

[tool.uv.sources]
klt-mom-native = { path = "native/mom" }
klt-congestion-native = { path = "native/congestion" }
klt-yield-native = { path = "native/yield" }
klt-statime-native = { path = "native/statime" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klayout_tools"]

# `klt signoff --manifest`/`--fleet` parse `docs/design-evidence-tiers.md` at
# runtime (see src/klayout_tools/design_evidence_tiers.py), so the doc is
# runtime tool data, not just prose: bundle it *inside* the package so a wheel
# install (`pip install`, `uv tool install`) can find it with no source
# checkout and no sibling `docs/` directory (issue #1050). The destination
# must stay in sync with `_PACKAGED_DOC_PATH` in that module -- a test
# asserts the two agree. (Note this is deliberately unlike `kb/`, which
# `kb.py` documents as a repo-checkout corpus intentionally left out of the
# wheel.)
[tool.hatch.build.targets.wheel.force-include]
"docs/design-evidence-tiers.md" = "klayout_tools/data/design-evidence-tiers.md"

# Build identity (issue #1202). `hatch_build.py` records the commit/tag/dirty
# state of the checkout each distribution is built from into a generated
# `klayout_tools/_build_info.py`, so `klt --version` can tell a tagged release
# apart from a post-tag source build carrying the same `version` string above.
# The package `version` deliberately stays static -- this adds a *build*
# identity beside it, it does not make the package version dynamic. Policy
# (what counts as a release) lives in `src/klayout_tools/build_identity.py`;
# the hook only records raw git facts.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# ruff formats fenced Python inside Markdown as well as .py files. `.loom/`,
# `.claude/`, and `.agents/` are vendored agent-tooling trees (Loom + Claude
# skills + repo-skills' agent-portable mirror, added by repo-skills 0.11.2)
# that this repo does not own and re-syncs from upstream — formatting them
# would churn on every upstream bump. No tree contains any first-party Python;
# scope the formatter to code we own so `ruff format --check .` can gate CI.
# `_vendor/mutation_variants.py` is a byte-exact third-party port (see the
# matching `per-file-ignores` entry below) -- excluded here too, so
# `ruff format` never reflows it away from the origin file it must stay
# diffable against.
exclude = [
    ".loom/**",
    ".claude/**",
    ".agents/**",
    "src/klayout_tools/_vendor/mutation_variants.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.mccabe]
# Cyclomatic-complexity ratchet, not a ceiling (issue #2034, decomposed from
# #2011 item 3). `C901` is deliberately NOT in `[tool.ruff.lint]`'s `select`
# list above -- adding it there would make plain `ruff check .` fail
# outright on every function already over this threshold (167, measured
# 2026-09-18 -- a snapshot, re-measure rather than trust this number),
# which is exactly the "ceiling that blocks landing on pre-existing debt"
# the issue argues against. This `max-complexity` value is instead the
# target `scripts/check_complexity_baseline.py` enforces as its own
# dedicated CI step: any function not listed in the committed
# `complexity-baseline.json` must stay at or under this value, and any
# baselined function must not get *more* complex than its recorded value
# (getting less complex, or disappearing, never fails). See that script's
# module docstring for the full mechanism, and
# `tests/test_check_complexity_baseline.py` for the drift guard that keeps
# this value and the script's own `MAX_COMPLEXITY` constant in sync.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Byte-exact ports of third-party source (docs/design/mutation-testing-spike.md,
# "Attribution mechanics"; `src/klayout_tools/_vendor/__init__.py`'s own "port,
# don't fork silently" rule) keep the upstream file's own line breaks so a
# reviewer can diff against the origin unmodified -- reflowing them to satisfy
# this repo's 88-column style would itself be an undisclosed change.
"src/klayout_tools/_vendor/mutation_variants.py" = ["E501"]
