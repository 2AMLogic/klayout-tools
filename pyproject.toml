[project]
name = "klayout-tools"
version = "0.0.1"
description = "Tools for AI agents to work with IC layout (GDSII/OASIS via KLayout)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "2AM Logic", email = "robb@2amlogic.com" }]
requires-python = ">=3.10"
dependencies = [
    "klayout>=0.29",
]

[project.urls]
Homepage = "https://klayout-tools.org"
Repository = "https://github.com/2AMLogic/klayout-tools"

[project.scripts]
klt = "klayout_tools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klayout_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# ruff formats fenced Python inside Markdown as well as .py files. `.loom/` and
# `.claude/` are vendored agent-tooling trees (Loom + Claude skills) that this
# repo does not own and re-syncs from upstream — formatting them would churn on
# every upstream bump. Neither tree contains any first-party Python; scope the
# formatter to code we own so `ruff format --check .` can gate CI.
exclude = [".loom/**", ".claude/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
