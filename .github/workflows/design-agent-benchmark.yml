name: Design-agent benchmark

# Issue #1719: task-set schema validation + "every reference solution passes
# its own gate" check for benchmarks/design-agent/ -- the harness's own
# self-check via the deterministic `reference` candidate provider. Issue
# #1732 adds a second, additive job below that runs the same task set
# through the live-agent provider (`--provider live-agent`) instead, driving
# the S4->S5->S6 skill chain for a real regression signal on the design
# pipeline itself -- see benchmarks/design-agent/README.md's "Known
# limitations" for what that provider does and does not do. Issue #1739
# adds a third, also-additive job: a one-task smoke run of the *interactive*
# provider (`--provider interactive-agent`), where each attempt is a bounded
# multi-turn session with live `klt kb`/`klt sim` access in its own sandbox.
#
# `workflow_dispatch`/`schedule` only, mirroring `equiv-canary.yml`'s
# posture: every task's reference solution is an 18-corner `ngspice` sweep
# per `klt sim` call -- tens of minutes of simulator time in aggregate as of
# issue #1736 (every real-device task now parses a full sky130A model deck
# per corner, `"backend": "local-parallel"` in each affected sim_request.json
# notwithstanding), up from the low single-digit minutes the earlier generic
# (non-PDK) LEVEL=1 stand-in cost -- judged too heavy to gate every PR for a
# check whose task set changes rarely. Trigger manually from the Actions
# tab, or `gh workflow run design-agent-benchmark.yml`, whenever a
# task/reference solution changes, or on the weekly schedule below to catch
# a `klt eval`/`klt sim` engine regression even when the benchmark tree
# itself is untouched.

on:
  workflow_dispatch:
  schedule:
    # Every Monday 09:00 UTC -- an arbitrary, infrequent cadence; adjust
    # freely, this is not tied to any release schedule.
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: design-agent-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-agent-benchmark:
    name: Task-set validation + reference-solution self-check
    runs-on: ubuntu-latest
    # Measured, not guessed (issue #1781): a full run of this job on this
    # branch (workflow run 34806989777, 2026-09-14, PDK cache hit) took
    # 35m53s end to end -- "Regression-test..." 8m22s, "Validate task set +
    # reference solutions" 13m27s, "Run the harness" 13m29s (now
    # attempts-independent thanks to the deterministic-provider caching
    # this issue adds, so it costs about the same as the single-pass
    # validate step rather than 5x it). Budgeted at ~2.5x that measured
    # total (90 min) to comfortably absorb a PDK cache miss (the "Fetch
    # full sky130A PDK" step below is itself bounded at 20 min) plus normal
    # runner variance, without falling back to a defensive multi-hour guess.
    timeout-minutes: 90
    env:
      # Issue #1736: every reference solution's own klt sim request resolves
      # its device models against a real sky130A PDK now (models.pdk/lib,
      # via docs/cli/sim.md's $PDK_ROOT convention) instead of a repo-local
      # generic-model models.lib -- same full-PDK fetch equiv-canary.yml
      # already pins, reused here for reproducibility.
      PDK: sky130A
      PDK_ROOT: ${{ github.workspace }}/.pdk-cache
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        run: uv sync --locked --extra dev

      - name: Install ngspice
        # See .github/workflows/ci.yml's step of the same name for the
        # per-package/timeout rationale -- identical install path.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: scripts/ci-apt-install.sh ngspice

      - name: Verify ngspice runs headlessly
        run: ngspice -v

      - name: Install volare
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user volare
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Cache full sky130A PDK (volare, pinned)
        id: pdk-cache
        uses: actions/cache@v6
        with:
          path: .pdk-cache
          # Same pinned open_pdks build equiv-canary.yml/place-and-route-
          # smoke.yml pin, reused here for reproducibility rather than
          # "whatever volare's latest is at run time".
          key: sky130A-pdk-c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Fetch full sky130A PDK (volare, cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          volare enable --pdk sky130 c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Regression-test the reference-passes/degraded-variant-fails contract
        # tests/test_design_agent_benchmark.py's `deliberately_broken`/
        # `mutation_gate` integration tests need a full sky130A ngspice
        # PDK (issue #1736), which ci.yml's main `test` job deliberately
        # does not provision (liberty-only, see that job's own `pytest`
        # step comment) -- they skip there and run for real here instead,
        # against the real PDK this job already fetched above. The
        # `mutation_gate` selector replaced `medium_tier_gates` in issue
        # #2262, when the hand-written mutation list moved out of that test
        # and into per-task `tasks/<id>.mutations.json` documents; it also
        # picks up that section's fast (stubbed-`klt eval`) unit tests,
        # deliberately.
        run: |
          uv run --frozen --extra dev pytest tests/test_design_agent_benchmark.py \
            -k "deliberately_broken or mutation_gate" -v

      - name: Validate task set + reference solutions + mutation gates
        # `validate` also enforces every task's declared mutation gate as of
        # issue #2262 (each `tasks/<id>.mutations.json` mutant must be
        # rejected by its own task's gate), which adds one more real corner
        # sweep per declared mutant -- 4 as of this issue, against the 12
        # reference-solution sweeps this step already paid for. Measuring and
        # (if needed) caching that added cost is deferred to issue #2263,
        # when there is more than 3 tasks' worth of it to measure.
        run: |
          uv run --frozen python scripts/design_agent_benchmark.py validate \
            | tee design-agent-benchmark-validate.json

      - name: Run the harness (reference candidate provider, pass@1/pass@5)
        # Deterministic reference-provider proof-of-concept -- see
        # benchmarks/design-agent/README.md "Known limitations". Always
        # reports 100% pass while the harness itself is healthy; a drop
        # below 100% here is a regression in the harness's own klt
        # eval/klt sim wiring, not (yet) in the design pipeline.
        #
        # --attempts 5 (restored from #1736's --attempts 2 stopgap, issue
        # #1781): `run_task_attempts` now runs a provider marked
        # `is_deterministic = True` (the reference provider) for real
        # exactly once per task and replicates that one result across the
        # remaining attempt slots, rather than re-running `klt eval` (and
        # therefore the full 18-corner sky130A sweep) `--attempts` times
        # for a provider that is byte-identical every attempt by
        # construction -- so this step's own cost no longer scales with
        # `--attempts` at all; see `run_task_attempts`'s docstring in
        # `scripts/design_agent_benchmark.py`.
        run: |
          uv run --frozen python scripts/design_agent_benchmark.py run \
            --attempts 5 --k 1 5 --out design-agent-benchmark-run.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-agent-benchmark-report
          path: |
            design-agent-benchmark-validate.json
            design-agent-benchmark-run.json
          retention-days: 90

  design-agent-benchmark-live:
    name: Live-agent S4->S5->S6 pass@k (issue #1732)
    runs-on: ubuntu-latest
    # Additive alongside the job above -- never replaces its deterministic
    # `reference`-provider self-check. Bounded well under this ceiling in
    # the common case (3 attempts x 4 easy-tier tasks, 120s/attempt agent
    # timeout below); the ceiling itself is the backstop against a genuinely
    # hung `claude` invocation the per-attempt timeout somehow missed.
    timeout-minutes: 90
    env:
      # A repository secret this project does not provision by default (see
      # benchmarks/design-agent/README.md's "Known limitations" and the
      # tracked follow-up issue for provisioning it) -- the same headless-
      # auth env var `.loom/scripts/spawn-claude.sh`'s own token-pool
      # convention sets for the `claude` CLI. The run step below degrades to
      # a documented, non-failing skip when this is empty, exactly the way
      # a fork's build (which never has repo secrets) would see it.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Issue #1736: see the design-agent-benchmark job's own env block above
      # for why every klt sim call now needs a real sky130A PDK.
      PDK: sky130A
      PDK_ROOT: ${{ github.workspace }}/.pdk-cache
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        run: uv sync --locked --extra dev

      - name: Install ngspice
        # See .github/workflows/ci.yml's step of the same name for the
        # per-package/timeout rationale -- identical install path.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: scripts/ci-apt-install.sh ngspice

      - name: Verify ngspice runs headlessly
        run: ngspice -v

      - name: Install volare
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user volare
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Cache full sky130A PDK (volare, pinned)
        id: pdk-cache
        uses: actions/cache@v6
        with:
          path: .pdk-cache
          key: sky130A-pdk-c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Fetch full sky130A PDK (volare, cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          volare enable --pdk sky130 c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Install the claude CLI
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the harness (live-agent candidate provider, pass@1/pass@3)
        # Drives one headless `claude -p` invocation per attempt through
        # the S4->S5->S6 skill chain (scripts/design_agent_benchmark.py's
        # `make_live_agent_provider` -- see its docstring and
        # benchmarks/design-agent/README.md for the deliberate single-turn
        # scope-narrowing) and scores the agent's own proposed netlist(s),
        # never the reference solution -- a real regression signal for the
        # design pipeline, not just this harness's own plumbing. 3
        # attempts/task (not the default job's 5) and a 120s per-attempt
        # agent timeout keep this bounded well under the job's own ceiling
        # above.
        run: |
          set -e
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '{"schema_version": 1, "provider": "live-agent", "skipped": true, "reason": "CLAUDE_CODE_OAUTH_TOKEN secret not provisioned"}' \
              | tee design-agent-benchmark-live-run.json
            echo "design-agent-benchmark (live-agent): SKIPPED - CLAUDE_CODE_OAUTH_TOKEN secret not provisioned (see benchmarks/design-agent/README.md's Known limitations)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run --frozen python scripts/design_agent_benchmark.py run \
            --provider live-agent --attempts 3 --k 1 3 --agent-timeout-s 120 \
            --out design-agent-benchmark-live-run.json
          pass1=$(jq -r '.overall.pass_at_k["1"] // "null"' design-agent-benchmark-live-run.json)
          solved=$(jq -r '.overall.solved_count' design-agent-benchmark-live-run.json)
          total=$(jq -r '.overall.task_count' design-agent-benchmark-live-run.json)
          tiers=$(jq -r '
            .tiers
            | to_entries
            | map(select(.value.task_count > 0))
            | map("\(.key)=\(.value.solved_count)/\(.value.task_count)")
            | join(", ")
          ' design-agent-benchmark-live-run.json)
          echo "design-agent-benchmark (live-agent): overall pass@1=${pass1} solved=${solved}/${total} (${tiers})" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-agent-benchmark-live-report
          path: design-agent-benchmark-live-run.json
          retention-days: 90

  design-agent-benchmark-interactive:
    name: Interactive tool-using S4->S5->S6 smoke (issue #1739)
    runs-on: ubuntu-latest
    # Additive alongside BOTH jobs above -- neither is replaced. A single
    # easy-tier task, 2 attempts, because each attempt here is a multi-turn
    # session that may run several real 18-corner `ngspice` sweeps of its
    # own (the whole point of the provider). This is a "the tool-using loop
    # still works end to end" smoke signal, not a pass@k measurement; the
    # single-turn job above remains the cheap full-task-set number.
    timeout-minutes: 120
    env:
      # Same never-provisioned-by-default secret, same documented skip, as
      # the live-agent job above.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Issue #1736: see the design-agent-benchmark job's own env block above
      # for why every klt sim call now needs a real sky130A PDK.
      PDK: sky130A
      PDK_ROOT: ${{ github.workspace }}/.pdk-cache
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        run: uv sync --locked --extra dev

      - name: Install ngspice
        # See .github/workflows/ci.yml's step of the same name for the
        # per-package/timeout rationale -- identical install path.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: scripts/ci-apt-install.sh ngspice

      - name: Verify ngspice runs headlessly
        run: ngspice -v

      - name: Install volare
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user volare
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Cache full sky130A PDK (volare, pinned)
        id: pdk-cache
        uses: actions/cache@v6
        with:
          path: .pdk-cache
          key: sky130A-pdk-c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Fetch full sky130A PDK (volare, cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          volare enable --pdk sky130 c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Install the claude CLI
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the harness (interactive tool-using provider, one task)
        # Each attempt gets a private sandbox seeded with the S4/S5/S6 skill
        # files, the task's model library, a working copy of its `klt sim`
        # request, and a `bin/klt` bound to this checkout -- so the session
        # runs real `klt kb`/`klt sim` calls (scripts/design_agent_benchmark.py's
        # `make_interactive_agent_provider`). Bounded per attempt by both
        # --agent-timeout-s and --agent-tool-budget; the job ceiling above is
        # only the backstop.
        run: |
          set -e
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '{"schema_version": 1, "provider": "interactive-agent", "skipped": true, "reason": "CLAUDE_CODE_OAUTH_TOKEN secret not provisioned"}' \
              | tee design-agent-benchmark-interactive-run.json
            echo "design-agent-benchmark (interactive-agent): SKIPPED - CLAUDE_CODE_OAUTH_TOKEN secret not provisioned (see benchmarks/design-agent/README.md's Known limitations)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p .klt/interactive-smoke-tasks
          cp benchmarks/design-agent/tasks/common-source-amp.json .klt/interactive-smoke-tasks/
          uv run --frozen python scripts/design_agent_benchmark.py run \
            --provider interactive-agent --tasks-dir .klt/interactive-smoke-tasks \
            --attempts 2 --k 1 2 --agent-timeout-s 900 --agent-tool-budget 40 \
            --agent-sandbox-root .klt/interactive-smoke-sandboxes \
            --out design-agent-benchmark-interactive-run.json
          pass1=$(jq -r '.overall.pass_at_k["1"] // "null"' design-agent-benchmark-interactive-run.json)
          solved=$(jq -r '.overall.solved_count' design-agent-benchmark-interactive-run.json)
          total=$(jq -r '.overall.task_count' design-agent-benchmark-interactive-run.json)
          echo "design-agent-benchmark (interactive-agent): overall pass@1=${pass1} solved=${solved}/${total}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-agent-benchmark-interactive-report
          path: |
            design-agent-benchmark-interactive-run.json
            .klt/interactive-smoke-sandboxes/**/agent-session.json
            .klt/interactive-smoke-sandboxes/**/agent-transcript.jsonl
            .klt/interactive-smoke-sandboxes/**/*.spice
          retention-days: 90
