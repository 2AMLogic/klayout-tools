name: CI

# Green/red gate for every PR and every push to main: ruff lint + pytest.
# Everything here is headless — the KLayout Python module (`klayout.db` / `pya`)
# is used in batch mode only; nothing requires the KLayout GUI.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    # Both ruff steps below GATE — if either is red, run
    # `uv run --extra dev ruff format .` / `uv run --extra dev ruff check . --fix`
    # locally and commit the result. Do NOT add continue-on-error to either
    # step: it makes this job always green regardless of ruff's exit code,
    # which is exactly how a repo accumulates hundreds of unformatted files
    # behind a false-green check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails the job if uv.lock is stale relative to pyproject.toml.
        run: uv sync --locked --extra dev

      - name: ruff format --check
        # Scoped to first-party code by [tool.ruff.format] exclude in
        # pyproject.toml — vendored .loom/ and .claude/ trees are not governed.
        run: uv run --frozen --extra dev ruff format --check .

      - name: ruff check
        run: uv run --frozen --extra dev ruff check .

      - name: Cyclomatic-complexity ratchet (C901)
        # scripts/check_complexity_baseline.py (issue #2034, decomposed from
        # #2011 item 3). C901 is deliberately excluded from the `ruff check`
        # step above's select list -- see pyproject.toml's
        # [tool.ruff.lint.mccabe] comment -- so this dedicated step is what
        # actually gates complexity: fails on a function newly over
        # max-complexity that is not in complexity-baseline.json, or on a
        # baselined function whose complexity has increased since that file
        # was recorded. A baselined function that improves (or disappears)
        # never fails this step.
        #
        # complexity-baseline.json is a snapshot, not a moving target: a PR
        # that only reduces complexity in files nobody else is touching can
        # pass locally against a checkout that is already stale by the time
        # it merges, because *other* PRs with their own complexity-affecting
        # diffs merged first (#2055 -- the baseline landed already stale for
        # exactly this reason, four functions deep, and had grown to eight by
        # the time it was fixed). If you are about to merge a baseline
        # re-snapshot (`--update-baseline`) and other PRs are in flight,
        # re-run the checker against a *fresh* `origin/main` immediately
        # before merging rather than trusting a snapshot taken earlier in the
        # review cycle.
        run: uv run --frozen --extra dev python scripts/check_complexity_baseline.py

      - name: Committed examples/ carry no absolute host paths
        # `klt env-provenance lint-envelope` (issue #2224) over every
        # committed JSON artifact under examples/. GATES -- exit 3 means a
        # committed example embeds an absolute host path, which resolves
        # nowhere but the machine that produced it: regenerating the artifact
        # on another checkout byte-differs for a reason unrelated to the
        # design, and on a public repo an author path gets disclosed along
        # with it (docs/json-contract.md -> "Repo-relative provenance in
        # *committed* artifacts"). That is not hypothetical here: three
        # examples/critical-net-mom-fidelity/*.json reports shipped with the
        # generating worktree's absolute path in `file`/`netlist_path` until
        # issue #2230 fixed them and added this step.
        #
        # To fix a failure: make the path repo-relative (what
        # examples/critical-net-mom-fidelity/generate_and_measure.py's
        # `_committable()` does), drop it in favour of the record's own
        # `provenance.input.content_hash`, or -- for a placeholder a reader
        # substitutes into -- spell it with an angle-bracket template root
        # (`<abs-path>/sky130A`), which the lint exempts by design. Do NOT
        # reach for `--allow-prefix`: the tree passes today with an EMPTY
        # allow-list, and that is the property worth keeping.
        #
        # `git ls-files` (not a shell glob) so the set is exactly what is
        # committed, and `xargs -r` so a tree with no matches is a no-op
        # rather than a usage error. No `-0`/NUL handling: this repo has no
        # example paths with spaces, and a filename that needed it would be
        # its own problem.
        run: |
          git ls-files 'examples/**/*.json' \
            | xargs -r uv run --frozen --extra dev klt env-provenance lint-envelope

  native:
    name: ${{ matrix.job_name }}
    # `native/mom/` (issue #718), `native/congestion/` (issue #785, Epic
    # #700 Phase 1 §3.6) and `native/yield/` (issue #816, Phase 1a of the
    # statistical/yield epic #710) are this repo's first three Rust
    # components -- the `klt_mom_native`/`klt_congestion_native`/
    # `klt_yield_native` pyo3 extensions behind `klt mom`/the congestion
    # pre-check research spike/`klt yield`. Each crate's numerics have their
    # own `cargo test` suite the Python job never exercises, so this job
    # exists: fmt + clippy + unit tests, plus a real end-to-end run through
    # the built extension. One matrix leg per crate (issue #929) collapses
    # what used to be three structurally-identical `native`/
    # `native-congestion`/`native-yield` jobs into a single parameterized
    # job -- `${{ matrix.job_name }}` above preserves each leg's original,
    # separately-attributable check name in the GitHub checks UI (GitHub
    # names each matrix run's check after the job's `name:` with its
    # already-interpolated matrix values, so branch-protection required
    # status checks configured against the old three names keep matching).
    #
    # `native/legalize/` and `native/statime/` are intentionally NOT in this
    # matrix -- `native/statime/` has its own pyo3-extension job below
    # (`native-statime`, issue #925) and `native/legalize/` has no CI job
    # yet; both are out of scope for issue #929.
    #
    # No toolchain-install step: ubuntu-latest images ship a rustup-managed
    # stable Rust, so `cargo` is already on PATH (matching how this repo
    # avoids third-party actions elsewhere).
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29); fork PRs
    # route back to GitHub-hosted instead of being skipped.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      # fail-fast: false so e.g. a congestion regression doesn't cancel the
      # in-flight mom/yield legs -- matches this repo's other multi-leg
      # matrix (`test` below) and preserves the old three-independent-jobs
      # behavior, where one job's failure never touched the others.
      fail-fast: false
      matrix:
        include:
          - crate: mom
            job_name: Native engines (Rust)
            dir: native/mom
            group: mom
            timeout_minutes: 30
            # `--nocapture` so `solver::tests::iterative_solve_matches_direct_lu_solve`'s
            # printed convergence-rate report (issue #799's acceptance
            # criterion that the rate be *reported*, not only asserted)
            # lands in this leg's log on a green run too, matching how the
            # Python step already does this for
            # tests/test_mom_validation.py's convergence tables. Neither
            # congestion nor yield need this.
            cargo_test_args: "-- --nocapture"
            # tests/test_mom_ports_validation.py (issue #894, Phase 2b),
            # tests/test_mom_peec_validation.py (issue #797), and
            # tests/test_mom_fullwave_validation.py (issue #893) are listed
            # explicitly alongside tests/test_mom.py and
            # tests/test_mom_validation.py because they are what actually
            # exercise the PEEC inductance/resistance and full-wave
            # characteristic-impedance/propagation-constant closed-form
            # validation, and the "S-parameters match the closed-form
            # reference" acceptance criterion, in CI rather than only
            # locally.
            test_paths: >-
              tests/test_mom.py tests/test_mom_validation.py
              tests/test_mom_ports_validation.py
              tests/test_mom_peec_validation.py
              tests/test_mom_fullwave_validation.py
            extension_module: klt_mom_native
            no_skip_message: "klt_mom_native did not install -- tests/test_mom.py would have skipped"
          - crate: congestion
            job_name: Native engines (Rust) — congestion pre-check
            dir: native/congestion
            group: congestion
            timeout_minutes: 20
            cargo_test_args: ""
            test_paths: tests/test_congestion.py
            extension_module: klt_congestion_native
            no_skip_message: "klt_congestion_native did not install -- tests/test_congestion.py would have skipped"
          - crate: yield
            job_name: Native engines (Rust) — yield statistics
            dir: native/yield
            group: yield
            timeout_minutes: 20
            cargo_test_args: ""
            # Both files share this one crate (issue #923, Phase 3 of the
            # statistical/yield epic #710, added `klt yield-sensitivity` to
            # the same `klt_yield_native` extension `klt yield` uses).
            test_paths: tests/test_yield.py tests/test_yield_sensitivity.py
            extension_module: klt_yield_native
            no_skip_message: "klt_yield_native did not install -- tests/test_yield.py's and tests/test_yield_sensitivity.py's statistics tiers would have skipped"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.dir }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.dir)) }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # Each crate's own Rust unit-test suite -- e.g. the yield crate's
        # closed-form oracles (erfc against DLMF values, Clopper-Pearson
        # against directly-solved binomial tails, the +/-2 sigma yield
        # against erf(sqrt(2))). `matrix.cargo_test_args` is only non-empty
        # for mom (see the matrix comment above).
        run: cargo test ${{ matrix.cargo_test_args }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build + install the ${{ matrix.extension_module }} extension
        # `--group <crate>` resolves `klt-<crate>-native` from
        # `${{ matrix.dir }}` via pyproject.toml's [tool.uv.sources] and
        # drives maturin to compile it. Without it, this crate's native-
        # extension-dependent tests skip themselves wholesale (by design, so
        # a Rust-less environment degrades gracefully) -- this step is what
        # makes sure the skip is never the only thing CI ever sees.
        #
        # --reinstall-package klt-<crate>-native (issue #1885, found on PR
        # #1879): the `Set up uv` step above enables setup-uv's cache with
        # the DEFAULT `cache-dependency-glob`, which keys ~/.cache/uv on
        # uv.lock / pyproject.toml / requirements files only -- never on
        # `native/**/*.rs` or `native/**/Cargo.*`. A Rust-only change
        # therefore restores the PREVIOUSLY BUILT wheel for this crate out
        # of the uv cache and `uv sync` reports "Installed ... +
        # klt-<crate>-native" without ever invoking maturin, so the pytest
        # run below exercises a STALE extension: a false red when the branch
        # fixes something (PR #1879's two new tests failed in CI against
        # code that no longer existed), and a silent false GREEN when the
        # branch breaks something. `--reinstall-package` implies
        # `--refresh-package` (`uv sync --help`), which invalidates that
        # cached build and forces a rebuild from this checkout's Rust
        # sources; it is scoped to the one local path package, so every
        # other wheel in the environment still comes from the cache and the
        # step stays fast. The crate name matches
        # pyproject.toml's [tool.uv.sources] keys: klt-mom-native,
        # klt-congestion-native, klt-yield-native.
        #
        # The freshness gate below is what keeps that flag honest -- see
        # docs/design/native-extension-freshness.md.
        working-directory: .
        run: |
          uv sync --locked --extra dev --group ${{ matrix.group }} \
            --reinstall-package klt-${{ matrix.crate }}-native

      - name: Assert ${{ matrix.extension_module }} is this checkout's (freshness gate)
        # GATE, and deliberately BEFORE pytest (issue #1889). Two failure
        # modes, one step:
        #
        #   1. the extension did not install at all -- the tests below would
        #      have skipped themselves and this leg would have been green
        #      while testing nothing (this is the old "no silent skip"
        #      assert, folded in here so there is exactly one importability
        #      gate per leg);
        #   2. the extension installed but is STALE -- `uv sync` served a
        #      cached wheel built from different Rust sources, so the tests
        #      below would have validated the PREVIOUS build. That is the
        #      dangerous direction: the cache normally holds main's wheel, so
        #      a branch that breaks this crate can go green against it.
        #
        # The check is content-based, never mtime-based: `build.rs` embeds an
        # FNV-1a-64 fingerprint of the crate's Rust sources into the module as
        # `__source_fingerprint__` and the script recomputes it from this
        # checkout. A timestamp comparison would be defeated by the very
        # mechanism it is meant to catch -- this pool's self-hosted runners
        # reuse their workspace, where `git checkout` does not reliably
        # advance a tracked file's mtime.
        working-directory: .
        run: |
          uv run --frozen --extra dev --group ${{ matrix.group }} \
            python scripts/native_source_fingerprint.py ${{ matrix.dir }} \
            --assert-module ${{ matrix.extension_module }} \
            --import-error-message "${{ matrix.no_skip_message }}"

      - name: Run the klt ${{ matrix.crate }} tests
        # --capture=tee-sys so the closed-form comparison and
        # convergence-rate tables (mom's tests/test_mom_validation.py, issue
        # #719) print in this leg's log on a green run too, not only on
        # failure. It still captures, so capsys-based CLI assertions are
        # unaffected -- unlike -s / --capture=no, which would break them.
        working-directory: .
        run: |
          uv run --frozen --extra dev --group ${{ matrix.group }} pytest \
            ${{ matrix.test_paths }} -v --capture=tee-sys

      - name: Install the external NEC2++ oracle and run the cross-validation test
        # tests/test_mom_cross_validation.py (issue #895, Phase 2c) checks
        # klt mom's full-wave S-parameters (#893/#894) against PyNEC
        # (NEC2++), a genuinely external, independently-implemented
        # Method-of-Moments solver -- see
        # docs/design/mom-cross-validation.md for the full methodology and
        # why PyNEC (license-handling: it is never imported by this repo's
        # own code, only by scripts/mom_nec_reference.py, always invoked as
        # its own subprocess). `--extra mom-cross-validation` requires
        # Python >=3.11 (this job's runner default satisfies that; see that
        # extra's own pyproject.toml comment for the marker), so this step
        # runs after the klt_mom_native checks above rather than folded into
        # the same `uv sync` line, keeping the two dependency surfaces easy
        # to attribute independently on a failure. mom-only (issue #929's
        # matrix has no equivalent for congestion/yield): guarded so it does
        # not run on those legs.
        #
        # No --reinstall-package here on purpose: klt-mom-native is already
        # installed from this checkout (and gated on above), and this sync
        # only adds PyNEC -- uv leaves an already-satisfied package alone
        # rather than re-serving it from the cache, so rebuilding the
        # extension a second time would only cost time.
        if: matrix.crate == 'mom'
        working-directory: .
        run: |
          uv sync --locked --extra dev --group mom --extra mom-cross-validation
          uv run --frozen --extra dev --group mom --extra mom-cross-validation \
            pytest tests/test_mom_cross_validation.py -v --capture=tee-sys

      - name: Assert the cross-validation test actually ran (no silent skip)
        if: matrix.crate == 'mom'
        working-directory: .
        run: |
          uv run --frozen --extra dev --group mom --extra mom-cross-validation \
            python -c "import PyNEC" || {
            echo "::error::PyNEC did not install -- tests/test_mom_cross_validation.py would have skipped"
            exit 1
          }

  native-statime:
    name: Native engines (Rust) — static timing
    # `native/statime/` (issue #809, Epic #704 Phase 1c) shipped as a plain
    # `cargo build`/`cargo test` spike binary with no CI job at all -- issue
    # #925 (Epic #704 Phase 3) promoted it to the `klt_statime_native` pyo3
    # extension backing `klt synthesize`'s additive `sta` critical-path
    # field, so it gets its own job here, per the one-job-per-native-engine
    # precedent `native`/`native-congestion`/`native-yield` set above. The
    # crate still builds its standalone `klt-statime` CLI binary from the
    # same source -- `cargo test`/`clippy` below cover both targets
    # (`--all-targets`).
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29); fork PRs
    # route back to GitHub-hosted instead of being skipped.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/statime
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/statime/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/statime/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # The engine's own unit tests (liberty tokenizer, netlist parser,
        # timing-graph propagation). Issue #925 integrated this crate
        # without touching its numerics, so these must keep passing
        # unmodified. NLDM bilinear-interpolation coverage moved to
        # `native/nldm-interp`'s own `cargo test` (issue #2272, the
        # `native-techmap` job below) when this crate's `nldm.rs` became a
        # thin re-export of that shared crate.
        run: cargo test

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build + install the klt_statime_native extension
        # `--group statime` resolves klt-statime-native from native/statime/
        # via pyproject.toml's [tool.uv.sources] and drives maturin to
        # compile it.
        #
        # --reinstall-package klt-statime-native (issue #1892, the
        # `native-statime` counterpart of #1885): without it, a Rust-only
        # change to native/statime/ restores the previously built wheel from
        # the uv cache -- setup-uv's default cache-dependency-glob never keys
        # on `native/**/*.rs` -- and the tests below exercise a stale
        # extension. See the `native` matrix job's own copy of this comment
        # for the full mechanism.
        working-directory: .
        run: |
          uv sync --locked --extra dev --group statime \
            --reinstall-package klt-statime-native

      - name: Assert klt_statime_native is this checkout's (freshness gate)
        # GATE, before the tests (issue #1889): fails when the extension did
        # not install at all (the tests below would have skipped themselves)
        # AND when it installed but was served stale from the uv cache. See
        # the `native` matrix job's own copy of this step, and
        # docs/design/native-extension-freshness.md.
        working-directory: .
        run: |
          uv run --frozen --extra dev --group statime \
            python scripts/native_source_fingerprint.py native/statime \
            --assert-module klt_statime_native \
            --import-error-message "klt_statime_native did not install -- tests/test_sta.py's extension tier would have skipped"

      - name: Run the klt sta tests
        # tests/test_sta.py is hermetic (no PDK, no Rust needed -- it also
        # runs in the `test` job below); the extension-backed tier here is
        # what proves the real pyo3 boundary works.
        # tests/test_sta_corpus.py still self-skips: it needs a real ~13 MB
        # sky130 liberty this workflow does not provision, same posture as
        # tests/test_synthesize.py's own real-PDK tier.
        working-directory: .
        run: |
          uv run --frozen --extra dev --group statime pytest \
            tests/test_sta.py tests/test_sta_corpus.py \
            -v --capture=tee-sys

      - name: Smoke-test the pyo3 boundary end to end
        # A real critical_path_json() call through the extension against a
        # checked-in corpus netlist would need the liberty this workflow has
        # no access to -- so instead assert the boundary's *error* contract,
        # which needs no PDK: a missing file must surface as a plain
        # ValueError (klayout_tools.sta.StaError), never a
        # pyo3_runtime.PanicException that `klt synthesize`'s best-effort
        # `sta` stage would fail to catch (see native/statime/src/lib.rs's
        # catch_unwind).
        working-directory: .
        run: |
          uv run --frozen --extra dev --group statime python -c "
          from klayout_tools.sta import StaError, compute_critical_path
          try:
              compute_critical_path('/nonexistent/netlist.v', '/nonexistent/lib.lib', 'top')
          except StaError as exc:
              print('OK: StaError ->', exc)
          else:
              raise SystemExit('expected StaError from the pyo3 boundary')
          "

  native-techmap:
    name: Native engines (Rust) — technology mapping
    # `native/techmap/` (issue #874, Epic #704 Phase 2b) is a plain `cargo
    # build`/`cargo test` binary crate -- no `pyo3` extension, following
    # `native/legalize/`'s own precedent (`native/statime/` followed it too
    # until issue #925 promoted that crate to a pyo3 extension), so this job
    # only needs the Rust-only checks (fmt/clippy/test); the real end-to-end
    # exercise of the compiled `klt-techmap` binary (issue #875's
    # `--verify-equivalence` gate) happens in the `test` job below, which
    # already provisions a real `yosys`/`iverilog` `klt equiv` needs.
    #
    # ubuntu-latest, not the dedicated heavy runner (issue #1971): #1246
    # originally routed this job to `[self-hosted, heavy]` (2AMLogic/2am#29)
    # as a proving PR for the runner itself, but the job does ~12-25s of
    # real work (fmt + clippy + test on one small binary crate, no maturin
    # build, no PDK) and real job telemetry showed it queuing 3-6 minutes
    # behind the rest of this workflow's self-hosted legs for that -- the
    # same "seconds of compute, minutes-to-hours of queue" shape #1971
    # measured on sky130-pll/sky130-ldo's headless repo-check jobs, just at
    # this repo's smaller scale. `native-wave` below is the structurally
    # identical case (plain cargo build/test binary crate, no pyo3, no PDK)
    # and already runs on ubuntu-latest directly -- this brings
    # native-techmap in line with that precedent instead of the self-hosted
    # pool the genuinely heavy jobs below (the pyo3-extension `native`/
    # `native-statime` legs and the full `test` matrix, which builds
    # Yosys/Verilator/Icarus from source) still need.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/techmap
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/techmap/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/techmap/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Cache cargo registry + build output (nldm-interp)
        # `native/nldm-interp` (issue #2272) is a path dependency of both
        # `native/statime` and `native/techmap`, but this repo has no root
        # `Cargo.toml`/workspace -- each of those crates' own `cargo test`
        # above only runs *its own* package's tests, never a path
        # dependency's, so the shared crate's own union-of-both-forks test
        # suite needs its own explicit invocation below.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/nldm-interp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/nldm-interp/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check (nldm-interp)
        working-directory: native/nldm-interp
        run: cargo fmt --check

      - name: cargo clippy (nldm-interp)
        working-directory: native/nldm-interp
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (nldm-interp)
        working-directory: native/nldm-interp
        run: cargo test

  native-wave:
    name: Native engines (Rust) — waveform build/query
    # `native/wave/` (issues #1599/#1600, Epic #1585 Phases 2a/2b) is a
    # plain `cargo build`/`cargo test` binary crate -- no `pyo3` extension
    # -- following `native/techmap/`'s and `native/statime/`'s own
    # precedent (see that job's comment above), so this job only needs the
    # Rust-only checks (fmt/clippy/test). `cargo test` covers the full
    # `klt wave query` op vocabulary end to end against the committed FST
    # fixtures under `native/wave/tests/fixtures/`, plus `klt wave build`'s
    # own committed VCD/FST fixtures + response assertions -- no external
    # tool/PDK dependency, so unlike `native-techmap` there is no companion
    # Python-side job here (neither issue wires `klt-wave` into the Python
    # `klt` CLI; that is #1601's job).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/wave
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wave/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/wave/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  signoff-example:
    name: examples/signoff round-trip
    # `examples/signoff/drc.json` / `lvs.json` are real `klt drc` / `klt lvs`
    # envelopes -- the evidence `examples/signoff/manifest.json` cites. Nothing
    # regenerated them when those verbs changed, so they drifted a long way
    # from reality before anyone noticed (issue #2028: a whole coverage-schema
    # bump behind, and a `provenance.input: null` claim `klt lvs` stopped
    # making in #1969, with README.md documenting the stale shape as current).
    #
    # scripts/check-signoff-example.sh regenerates the directory and fails on
    # any diff -- see its header for what a failure means and how to fix it
    # (regenerate and commit, in the same PR as the verb change).
    #
    # Deliberately its own job rather than a step inside `test`: it needs no
    # ngspice/Yosys/Verilator toolchain (the example is PDK-free by design),
    # so it runs on ubuntu-latest in well under a minute instead of queueing
    # behind the heavy pool for a matrix it would run four redundant times in.
    #
    # No row in .github/ci-wall-clock-budget.json on purpose: an unbudgeted
    # job falls back to `default_job_budget_seconds` (600 s), which is the
    # documented path for a job with no measured baseline yet
    # (docs/guides/ci-wall-clock-budget.md, "Budget derivation"). Give it a
    # real budget at the next re-measure rather than guessing one now.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        run: uv sync --locked

      - name: Regenerate examples/signoff and assert no diff
        run: scripts/check-signoff-example.sh

  site:
    name: site/ (tsc + vitest)
    # `site/` is a self-contained Vite + React project (site/README.md) --
    # its own package.json, not part of the Python/Rust toolchains above.
    # Before this job, no CI job ran its vitest suite or `tsc -b` type
    # check: deploy-site.yml only fires on push to main (never on PRs) and
    # only runs a Vite build, not the tests or the type check (issue #1064).
    # So a `site/**` PR got zero CI signal on its frontend tests until it
    # merged.
    #
    # Path-filtered to site/** via the "Check for site/** changes" step
    # below (not a workflow-level `paths:` filter, which would gate every
    # job in this file, not just this one) so a PR that never touches the
    # frontend skips the Node setup / npm ci cost -- mirrors how
    # deploy-site.yml path-filters its own trigger.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the diff below can compare against the PR base
          # / pre-push commit -- the default shallow (depth-1) checkout
          # only has the tip commit.
          fetch-depth: 0

      - name: Check for site/** changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Fall back to "changed" if BASE is unavailable/unknown (e.g. a
          # force-pushed branch's `before` predates this shallow-turned-full
          # clone's history) rather than silently skipping the job.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "site_changed=true" >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" -- site/ | grep -q .; then
            echo "site_changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.filter.outputs.site_changed == 'true'
        uses: actions/setup-node@v7
        with:
          # Node 22+ per site/README.md / site's @types/node -- matches
          # deploy-site.yml's own Node setup.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        if: steps.filter.outputs.site_changed == 'true'
        run: npm --prefix site ci

      - name: Type check (tsc -b)
        # site/package.json's "check" script -- the same `tsc -b` the
        # "build" script runs before prerendering.
        if: steps.filter.outputs.site_changed == 'true'
        run: npm --prefix site run check

      - name: vitest run
        # site/package.json's "test" script.
        if: steps.filter.outputs.site_changed == 'true'
        run: npm --prefix site test

  test:
    name: Tests (Python ${{ matrix.python-version }})
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29); fork PRs
    # route back to GitHub-hosted instead of being skipped.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    # Explicit bound (issue #1009) so a stuck runner or hung step fails
    # outright instead of silently riding the platform default of 360
    # minutes. A real cold-cache run (Yosys/Icarus Verilog/Verilator all
    # built from source on a cache miss, not the ~2-3 minute cache-hit path
    # this job normally takes) measured 23m26s-24m28s across the matrix on
    # run 31452136100 (2026-08-11, triggered by a cache-key change in #689):
    # Yosys ~14.5min, Verilator ~6min, Icarus ~1m45s. 45 minutes leaves
    # ~1.9x margin over that measurement for runner variance.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml (requires-python).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (includes the klayout wheel)
        # --extra functional-verification pulls in the pinned cocotb (issue
        # #423, Phase 3 of Epic #391) -- a no-op on any interpreter >=3.14
        # per pyproject.toml's own marker (none in this job's matrix today,
        # but the resolver handles it correctly either way, verified while
        # developing this pin).
        run: uv sync --locked --extra dev --extra functional-verification

      - name: Install ngspice
        # klt sim (docs/cli/sim.md) invokes `ngspice -b` as a subprocess --
        # not a Python dependency, so it's installed here rather than via uv.
        # Package-manager install per the spike's "trivially CI-installable"
        # finding; tests skip gracefully (with a clear reason) if this binary
        # is ever absent, but CI always has it.
        #
        # Per-step timeout (issue #1204): this used to share the job's
        # 45-minute budget (#1009) with every other step, so an apt-mirror
        # stall could silently burn the whole job timeout before anything
        # failed -- confirmed on main and PR #1194 (multiple ~45min hangs on
        # this exact step, 2026-08-19). 5 minutes is generous for a normal
        # `apt-get update && apt-get install` of one package, while still
        # failing fast relative to the 45-minute job budget.
        #
        # The timeout alone only converts the stall into a *red check*
        # though (issue #1219): on 2026-08-19 the runner-local
        # `azure.archive.ubuntu.com` mirror blackholed connections and every
        # apt step in this job started failing at the 5-minute mark.
        # scripts/ci-apt-install.sh drops that mirror, bounds apt's own
        # acquire timeouts, and retries the whole `update && install` pair
        # within a budget sized to fit inside this 5-minute backstop -- see
        # its header comment for the log evidence. A genuine missing-package
        # failure is still surfaced immediately, non-zero.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: scripts/ci-apt-install.sh ngspice

      - name: Verify KLayout imports headlessly
        run: |
          uv run --frozen --extra dev python -c "
          import klayout.db as kdb
          print('klayout', kdb.Layout().dbu)
          "

      - name: Verify ngspice runs headlessly
        run: ngspice -v

      - name: Fetch real gallery-cell SPICE netlists
        # Pinned, checksum-verified per-file fetch (see the script's header
        # comment) -- small (~9 MB), unlike fetch-pdks.sh's lambdapdk. Backs
        # tests/test_gallery_signals.py's real-ngspice-against-a-real-cell
        # integration tests (issue #99); those tests skip gracefully (never
        # silently pass) if this step is ever unavailable, but CI always has it.
        run: scripts/fetch-cell-netlists.sh

      - name: Install Yosys build dependencies
        # scripts/install-yosys.sh builds Yosys from a pinned, checksum-
        # verified source release (issue #417) -- `apt-get install yosys`
        # would resolve Ubuntu 24.04's 0.33-5build2, ~30 releases stale
        # relative to the version docs/design/yosys-synthesis-spike.md's
        # worked example used (survey section 3.4). This installs the
        # from-source build's own prerequisites (CMake >= 3.28 already
        # ships on ubuntu-latest/noble); package-manager install, same
        # posture as the ngspice step above.
        #
        # Per-step timeout + noninteractive apt (issue #1204) and the
        # mirror-resilient wrapper (issue #1219): same apt-mirror-stall
        # exposure as the ngspice step -- see its comment above for the
        # incident evidence and rationale. This step was itself observed
        # stalling (run 32275002277, 3.11), so it gets the same treatment,
        # not just ngspice.
        #
        # CI_APT_DEADLINE / CI_APT_PER_CMD_TIMEOUT overrides (issue #1224):
        # this is the only one of the three apt-get steps that pulls a
        # package an order of magnitude larger than the others -- `cmake`
        # alone is 11.2 MB, vs. 4.4 MB for the whole `ngspice` step. Real job
        # logs (runs 32291907647 / 32292729034, both post-#1226) showed the
        # script's shared 90s-per-command / 250s-total default budget
        # repeatedly killing the `cmake` fetch mid-download even after
        # retrying, while the smaller steps completed fine under the same
        # numbers. Widening both knobs just for this step gives one attempt
        # enough contiguous time to land the large package instead of
        # restarting it piecemeal; 270s still leaves 30s of margin inside
        # the 300s (`timeout-minutes: 5`) backstop above, same proportion of
        # slack the script's own un-overridden defaults use (250s of 300s).
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          CI_APT_DEADLINE: "270"
          CI_APT_PER_CMD_TIMEOUT: "150"
        run: |
          scripts/ci-apt-install.sh \
            cmake bison flex libfl-dev libreadline-dev gawk tcl-dev \
            libffi-dev pkg-config zlib1g-dev

      - name: Cache pinned Yosys build
        id: yosys-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/yosys-0.67
          key: yosys-0.67-${{ runner.os }}-${{ hashFiles('scripts/install-yosys.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Yosys (cache miss only)
        if: steps.yosys-cache.outputs.cache-hit != 'true'
        run: scripts/install-yosys.sh

      - name: Add pinned Yosys to PATH
        run: echo "$HOME/.cache/yosys-0.67/bin" >>"$GITHUB_PATH"

      - name: Verify Yosys runs headlessly
        run: yosys -V

      - name: Install SymbiYosys (sby) + Bitwuzla runtime dependencies
        # scripts/install-symbiyosys.sh (issue #1312, Phase 2 of Epic #707)
        # installs sby -- the orchestration tool docs/design/
        # sequential-equivalence-survey.md section 4.1 identifies as the
        # prerequisite for every later Phase 2 sequential-equivalence item
        # -- plus a pinned Bitwuzla SAT/SMT backend. sby itself needs no
        # compiler (upstream's own `make install` just copies Python
        # files), so this only needs Bitwuzla's runtime shared-library
        # dependencies, not a full build toolchain like the Yosys step
        # above. libgmp10/libmpfr6 back Bitwuzla's own dynamic linkage
        # (see the script's header comment); libstdc++6/libgcc-s1 ship by
        # default on ubuntu-latest and need no explicit install.
        # python3-click: sby's launcher (`sby_core.py`) imports `click` from
        # the SYSTEM python3 -- the only third-party module in sby 0.67.
        # ubuntu-latest happens to ship it; the dedicated heavy runner's
        # image (2AMLogic/2am#29) does not, and on a cache hit the install
        # script never runs, so the verify step below died with
        # `ModuleNotFoundError: No module named 'click'` on the first
        # main run after #1246 routed this job there (2026-09-11).
        #
        # Per-step timeout + noninteractive apt (issue #1204) and the
        # mirror-resilient wrapper (issue #1219): same apt-mirror-stall
        # exposure as the ngspice/Yosys steps above -- see the ngspice
        # step's comment for the incident evidence and rationale.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: scripts/ci-apt-install.sh libgmp10 libmpfr6 python3-click

      - name: Cache pinned SymbiYosys + Bitwuzla install
        id: symbiyosys-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/symbiyosys-0.67
          key: symbiyosys-0.67-bitwuzla-0.9.1-${{ runner.os }}-${{ hashFiles('scripts/install-symbiyosys.sh', 'scripts/_install_common.sh') }}

      - name: Install pinned SymbiYosys + Bitwuzla (cache miss only)
        if: steps.symbiyosys-cache.outputs.cache-hit != 'true'
        run: scripts/install-symbiyosys.sh

      - name: Add pinned SymbiYosys + Bitwuzla to PATH
        # sby's own launcher (share/yosys/python3/sby.py) locates its
        # Python modules relative to this bin/ directory, and at runtime
        # shells out to `yosys`/`yosys-smtbmc` (already on PATH from the
        # pinned Yosys step above) and `bitwuzla` (installed into this same
        # prefix by scripts/install-symbiyosys.sh) -- see the script's
        # header comment for why this must run after, not before/instead
        # of, the pinned Yosys install.
        run: echo "$HOME/.cache/symbiyosys-0.67/bin" >>"$GITHUB_PATH"

      - name: Verify SymbiYosys + Bitwuzla run headlessly
        run: |
          sby --version
          bitwuzla --version

      - name: Cache pinned sky130_fd_sc_hd liberty
        id: sky130-liberty-cache
        uses: actions/cache@v6
        with:
          path: pdks/sky130-liberty
          key: sky130-liberty-${{ hashFiles('scripts/fetch-sky130-liberty.sh') }}

      - name: Fetch sky130_fd_sc_hd liberty (tt_025C_1v80 corner)
        # A real, Yosys-parseable Liberty timing view for `klt synthesize`'s
        # GCD worked example (yosys-synthesis-spike.md section 4) -- pinned
        # to the exact volare/open_pdks build the spike itself used, one
        # file extracted (not the whole ~166 MB release asset). See the
        # script's header comment for why this can't come from
        # scripts/fetch-pdks.sh's lambdapdk payload.
        run: scripts/fetch-sky130-liberty.sh

      - name: Install Icarus Verilog + Verilator build dependencies
        # scripts/install-icarus-verilog.sh / scripts/install-verilator.sh
        # build both from pinned, checksum-verified source releases (issue
        # #423, Phase 3 of Epic #391) -- `apt-get install iverilog`/
        # `verilator` resolve Ubuntu 24.04's `12.0-2build2`/`5.020-1`,
        # respectively a full major version and 30 releases stale relative
        # to the exact versions
        # docs/design/cocotb-verification-spike.md's worked example (section
        # 6) was captured against (verified against
        # packages.ubuntu.com/noble). This installs the from-source builds'
        # own prerequisites; package-manager install, same posture as the
        # ngspice/Yosys steps above. `autoconf`/`help2man` back Verilator's
        # build specifically (its source tarball ships `configure.ac`, not a
        # pre-generated `configure`); `gperf` backs Icarus's own lexer
        # generation.
        #
        # Per-step timeout + noninteractive apt (issue #1204) and the
        # mirror-resilient wrapper (issue #1219): same apt-mirror-stall
        # exposure as the ngspice step -- see its comment above for the
        # incident evidence and rationale.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          scripts/ci-apt-install.sh \
            bison flex gperf autoconf help2man

      - name: Cache pinned Icarus Verilog build
        id: icarus-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/icarus-13.0
          key: icarus-13.0-${{ runner.os }}-${{ hashFiles('scripts/install-icarus-verilog.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Icarus Verilog (cache miss only)
        if: steps.icarus-cache.outputs.cache-hit != 'true'
        run: scripts/install-icarus-verilog.sh

      - name: Add pinned Icarus Verilog to PATH
        run: echo "$HOME/.cache/icarus-13.0/bin" >>"$GITHUB_PATH"

      - name: Verify Icarus Verilog runs headlessly
        run: iverilog -V

      - name: Cache pinned Verilator build
        id: verilator-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/verilator-5.050
          key: verilator-5.050-${{ runner.os }}-${{ hashFiles('scripts/install-verilator.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Verilator (cache miss only)
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        run: scripts/install-verilator.sh

      - name: Add pinned Verilator to PATH
        run: echo "$HOME/.cache/verilator-5.050/bin" >>"$GITHUB_PATH"

      - name: Verify Verilator runs headlessly
        run: verilator --version

      - name: Cache native/techmap cargo build (debug)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/techmap/target
          key: cargo-techmap-debug-${{ runner.os }}-${{ hashFiles('native/techmap/Cargo.lock') }}
          restore-keys: cargo-techmap-debug-${{ runner.os }}-

      - name: Build klt-techmap (native/techmap, debug profile)
        # tests/test_techmap_equiv_gate.py (issue #875) invokes the real
        # `klt-techmap` binary via subprocess -- built here (debug profile,
        # functional correctness only, no lto) so the equivalence-gate
        # tests run for real rather than skip. ubuntu-latest images ship a
        # rustup-managed stable Rust already (see the `native` job's own
        # comment above), so no toolchain-install step is needed. Rebuilt
        # once per matrix entry (this job has no dedicated single-crate
        # job the way `native-mom`/`native-congestion`/`native-yield` do,
        # since `klt-techmap` has no `pyo3` extension surface to build);
        # the cache step above keeps a warm-cache rebuild fast.
        run: cargo build --manifest-path native/techmap/Cargo.toml

      - name: pytest
        # GH_TOKEN backs tests/test_ingest_canary.py's real `gh api`
        # integration tests (issue #62's public-repo gate + full canary
        # ingest) -- the default automatic token, not a new secret. Its
        # cross-repo/cross-org reach is exactly the reach the gate itself
        # needs at ingest time: it can read public repos anywhere, but a
        # private repo in a different org (e.g. 2AMLogic/gf180-trng) 404s,
        # which is the fail-closed "refuse" behavior those tests assert.
        #
        # PDK_ROOT/PDK point at the sky130_fd_sc_hd liberty fetched above --
        # this is what lets
        # tests/test_synthesize.py::test_integration_real_yosys_gcd_worked_example
        # (previously skipped in CI, per that test module's own docstring)
        # run for real here: a real pinned Yosys binary on $PATH plus a
        # real sky130_fd_sc_hd liberty resolving via `list_pdks()`. Every
        # other test that resolves a PDK either isolates PDK_ROOT/PDK
        # itself (autouse fixtures across test_gen.py/test_gen_compose.py/
        # test_extract.py/test_pdk.py) or sets them explicitly via
        # monkeypatch before use (test_synthesize.py's own stubbed-Yosys
        # tests) -- these two job-level values are only ever observed by
        # code that does not already override them.
        #
        # The pinned cocotb/Icarus Verilog/Verilator versions provisioned
        # above are asserted for real here by
        # tests/test_functional_verification_toolchain_pins.py (issue #423)
        # -- a real `cocotb`/`iverilog`/`verilator` on $PATH means those
        # tests run their actual version-string assertion rather than
        # skipping, so a silent apt/pip resolution drift fails this job
        # loudly instead of quietly invalidating
        # docs/design/cocotb-verification-spike.md's captured worked-example
        # numbers.
        #
        # The same real toolchain also flips
        # tests/test_functional_verification.py's `@pytest.mark.skipif`-
        # guarded integration tier from skipped to real here (issue #423 AC
        # #3): the GCD worked example (spike section 6) runs through `klt
        # functional-verification` against both `engine: "icarus"` and
        # `engine: "verilator"`, asserting the exact `TESTS=3 PASS=2 FAIL=1
        # SKIP=0` outcome and (Verilator only) its line/toggle/branch/expr
        # coverage percentages, plus the `options.random_seed` end-to-end
        # pinning/echo tests (issue #423 AC #4) -- including that two runs of
        # the same seeded request reproduce identical `tests[]` content.
        run: uv run --frozen --extra dev --extra functional-verification pytest
        env:
          GH_TOKEN: ${{ github.token }}
          PDK_ROOT: ${{ github.workspace }}/pdks/sky130-liberty
          PDK: sky130A

      - name: klt kb validate
        # Belt-and-suspenders alongside tests/test_kb.py (which calls the same
        # kb.validate_entries() implementation): runs the actual shipped
        # `klt kb validate` entry point so a malformed kb/ entry breaks the
        # build the same way a real user invocation would surface it.
        run: uv run --frozen --extra dev klt kb validate --format json

  test-numerical:
    name: Tests (numpy cross-check)
    # Issue #2276. The `test` matrix above is this repo's stdlib-only surface
    # by contract -- the runtime dependency set is deliberately just
    # klayout/jsonschema (src/klayout_tools/ir_solver.py's own docstring) --
    # so tests/test_ir_solver_numpy_crosscheck.py skips itself wholesale
    # there (`pytest.importorskip("numpy")`: a *declared* unavailability,
    # correct behaviour, never recorded as a pass and never a failure). This
    # job is the other half of that contract: the one place numpy is
    # actually installed -- via the `numerical` PEP 735 dependency group,
    # pinned in uv.lock (see pyproject.toml's comment on that group) -- so
    # the full-strength assertions against the real numerical oracle
    # (numpy.linalg.solve vs the pure-Python conjugate-gradient IR solver
    # behind `klt power`, and numpy's quantiles vs sim.py's Monte Carlo
    # statistics) run for real. docs/guides/dependency-gated-ci.md documents
    # the skip/refuse/fail convention this split implements.
    #
    # It also re-runs the golden-artifact drift detector
    # (scripts/check_artifact_determinism.py) under this dep-full
    # environment, which the `artifact-determinism` job below only ever runs
    # numpy-less. That is exactly the gap issue #2276's downstream evidence
    # describes: a -numerical job that ran only unit tests left the
    # publication --check never executed with dependencies present on CI,
    # and the output it guards drifted cross-platform undetected. Any check
    # that exists to catch drift must itself be EXECUTED in the dep-full
    # job, not merely be imported by it -- otherwise a numpy-dependent code
    # path in a generator is only ever validated by a run that cannot
    # exercise it. The two-checkout setup is duplicated (not moved) so the
    # numpy-less run stays independent of numpy availability and each job's
    # failure stays independently attributable.
    #
    # Deliberately ubuntu-latest, like `artifact-determinism`: the
    # cross-check suite is seconds of pure-Python CG against small dense
    # oracles and the drift detector's generators are ~1.5 s -- no PDK, no
    # toolchain, no reason to queue behind the heavy pool.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the primary copy
        uses: actions/checkout@v7
        with:
          path: primary

      - name: Check out a second copy at a different filesystem path
        # Same two-checkout shape the `artifact-determinism` job uses: a
        # different prefix AND a different path length, so a generator that
        # embeds its own absolute path produces different bytes here --
        # precisely what the byte-compare below is looking for.
        uses: actions/checkout@v7
        with:
          path: second-checkout/nested/deeper-than-the-primary

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies (klayout wheel + numpy)
        # Only the primary checkout gets a venv -- same reasoning as the
        # `artifact-determinism` job's copy of this step: each generator
        # inserts its own repo's src/ at the front of sys.path (and the
        # check exports a matching PYTHONPATH), so the second checkout's
        # code is exercised without a second sync.
        #
        # `--group numerical` is what distinguishes this job from every
        # stdlib-only surface: it pulls the uv.lock-pinned numpy the
        # cross-check suite below uses as its oracle.
        working-directory: primary
        run: uv sync --locked --extra dev --group numerical

      - name: Run the numpy cross-check suite
        # The module path is explicit: this job exists for this suite, so a
        # rename that left nothing running here must be a red, not a no-op.
        # --capture=tee-sys so any printed comparison tables land in this
        # leg's log on a green run too (the native jobs' pytest steps' same
        # choice), and tee'd to a file for the no-silent-skip assert below.
        # `set -o pipefail` so pytest's exit code survives the pipe (the
        # default shell here is `bash -e`, which without it would report the
        # tee's status).
        working-directory: primary
        run: |
          set -o pipefail
          uv run --frozen --extra dev --group numerical pytest \
            tests/test_ir_solver_numpy_crosscheck.py -v --capture=tee-sys \
            | tee /tmp/numpy-crosscheck-pytest.log

      - name: Assert the cross-check suite actually ran (no silent skip)
        # The whole point of this job (issue #2276): a full-strength suite
        # that silently skips is indistinguishable from the green numpy-less
        # runs every other job produces, so a skip here must be a red. Two
        # gates, mirroring the native jobs' no-silent-skip posture (the
        # freshness gate, issue #1889) and tightening it: numpy must be
        # importable, AND the pytest summary must show real passes and zero
        # skips -- an importable oracle with a skipped suite (a bad
        # importorskip, a renamed fixture, a collection-order surprise) is
        # exactly the false green this job exists to make impossible.
        working-directory: primary
        run: |
          uv run --frozen --extra dev --group numerical \
            python -c "import numpy" || {
            echo "::error::numpy did not install -- tests/test_ir_solver_numpy_crosscheck.py would have skipped"
            exit 1
          }
          summary="$(tail -n 1 /tmp/numpy-crosscheck-pytest.log)"
          echo "pytest summary: $summary"
          echo "$summary" | grep -qE '[1-9][0-9]* passed' || {
            echo "::error::the numpy cross-check suite reported no passing tests -- it silently skipped (issue #2276: this job exists so the full-strength assertions RUN, never skip)"
            exit 1
          }
          if echo "$summary" | grep -q 'skipped'; then
            echo "::error::the numpy cross-check suite reported skips -- numpy is provisioned in this job, so a skip here is a bug (issue #2276)"
            exit 1
          fi

      - name: Run the golden-artifact drift detector under the dep-full environment
        # scripts/check_artifact_determinism.py, numpy present (issue #2276
        # -- see this job's header comment for why this step is here and not
        # only in the numpy-less `artifact-determinism` job). Exit 1 = an
        # artifact differed; exit 2 = the check could not run -- both red,
        # never a silent pass.
        #
        # --forensics-dir (issue #2275): same evidence pack as the
        # `artifact-determinism` job -- both variants of every differing
        # artifact plus the rerun recipe -- uploaded by the next step under
        # a distinct name so the two jobs' uploads never 409 each other.
        # Dispatch-env note: identical reasoning to that job's header
        # comment -- no ATEN/MKL/oneDNN pinning applies to this stack (no
        # BLAS/PyTorch/oneDNN; numpy is dev-oracle-only, never on a
        # committed-byte path), and the host-libm class is handled by the
        # check's static scan + declared platform-variable regions.
        working-directory: primary
        run: |
          uv run --frozen --extra dev --group numerical python scripts/check_artifact_determinism.py \
            --checkout "$GITHUB_WORKSPACE/primary" \
            --checkout "$GITHUB_WORKSPACE/second-checkout/nested/deeper-than-the-primary" \
            --forensics-dir "$GITHUB_WORKSPACE/determinism-forensics-numerical" \
            --annotate

      - name: Upload failure forensics (artifact pairs + rerun recipe)
        # Issue #2275 triage evidence for the dep-full leg: written only on
        # failure, uploaded only on failure, retained like the repo's other
        # evidence artifacts. Distinct `name` from the
        # `artifact-determinism` job's upload -- both can fail in the same
        # workflow run, and sharing a name would 409 the second upload.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-forensics-numerical
          path: determinism-forensics-numerical/
          retention-days: 90
          if-no-files-found: ignore

  action-smoke-test:
    name: klt verify Action smoke test
    # Dogfoods action.yml (issue #268) against this repo's own fixtures on
    # every push/PR, so a broken action fails this repo's CI before it
    # breaks a downstream block repo's workflow -- see docs/guides/github-action.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Prepare fixture block directories
        # `layout-metrics` expects a block *directory* (docs/cli/layout-metrics.md),
        # so each fixture GDS gets its own tiny directory named layout.gds.
        run: |
          mkdir -p /tmp/klt-fixtures/clean-block /tmp/klt-fixtures/violating-block
          cp tests/corpus/sky130/sky130_fd_sc_hd__inv_1.gds /tmp/klt-fixtures/clean-block/layout.gds
          cp examples/drc/example.gds /tmp/klt-fixtures/violating-block/layout.gds

      - name: klt verify -- clean layout (expect success)
        id: clean
        uses: ./
        with:
          layout: /tmp/klt-fixtures/clean-block/layout.gds
          block: /tmp/klt-fixtures/clean-block
          verbs: drc,layout-metrics,layers,render
          deck: sky130
          output-dir: klt-action-output/clean
          # Distinct artifact names per invocation: both clean and violating
          # steps upload in the same workflow run, so sharing the default
          # names would 409 on the second actions/upload-artifact call.
          json-artifact-name: klt-json-outputs-clean
          render-artifact-name: klt-render-clean

      - name: Assert clean-layout status is success
        run: |
          test "${{ steps.clean.outputs.status }}" = "success" || {
            echo "::error::expected status=success for the clean fixture, got '${{ steps.clean.outputs.status }}'"
            exit 1
          }

      - name: klt verify -- layout with seeded DRC violations (expect failure surfaced)
        # fail-on-findings: false so this step itself doesn't red the job --
        # the *next* step asserts the violation was actually detected and
        # reported, which is the behavior under test (issue #268's "verb
        # failure surfaces clearly, not silently" edge case).
        id: violating
        uses: ./
        with:
          layout: /tmp/klt-fixtures/violating-block/layout.gds
          verbs: drc
          deck: sky130
          output-dir: klt-action-output/violating
          fail-on-findings: false
          json-artifact-name: klt-json-outputs-violating
          render-artifact-name: klt-render-violating

      - name: Assert violating-layout status is failure
        run: |
          test "${{ steps.violating.outputs.status }}" = "failure" || {
            echo "::error::expected status=failure for the seeded-violation fixture, got '${{ steps.violating.outputs.status }}' -- violations were not surfaced"
            exit 1
          }
          grep -q "violations" "${{ steps.violating.outputs.summary-markdown-path }}" || {
            echo "::error::step summary markdown did not mention violations"
            exit 1
          }

  artifact-determinism:
    name: Golden artifacts (hash seed + path varied)
    # Issue #2225. Every other job regenerates a golden artifact at most
    # once, from one checkout, under whatever hash seed the runner happens to
    # have. Two nondeterminism classes survive that indefinitely and were
    # both caught downstream only when an environment finally differed
    # (2AMLogic/gf180-surge PR #39; the SXT-013 slates):
    #
    #   1. set/dict-iteration-dependent ordering. `PYTHONHASHSEED` defaults
    #      to random ONLY when unset, and a runner that fixes the environment
    #      reproduces one ordering forever, so a count-tied list emitted in
    #      set order byte-compares clean on every run until somebody
    #      regenerates somewhere else.
    #   2. host-absolute paths baked into a committed artifact, which
    #      byte-compare clean on the machine that produced them and nowhere
    #      else.
    #
    # This job makes the environment differ on purpose: it regenerates the
    # same artifacts from TWO checkouts at different filesystem paths under
    # TWO different explicitly-set PYTHONHASHSEED values, then byte-compares
    # and names every differing artifact. See
    # scripts/check_artifact_determinism.py (and tests/test_artifact_
    # determinism.py, which pins its behaviour against synthetic generators
    # carrying each bug class).
    #
    # Deliberately ubuntu-latest and deliberately NOT part of the `test`
    # matrix: the three generators it drives need only the klayout wheel
    # (~1.5 s of work between them), so queueing behind the heavy pool --
    # four times over, once per Python version -- would cost far more than
    # the check.
    #
    # Dispatch-env pinning, scoped honestly to this stack (issue #2275's
    # "pin the dispatch environment" step): there is deliberately NO
    # ATEN_CPU_CAPABILITY / MKL_CBWR / ONEDNN_MAX_CPU_ISA here. This repo
    # has no PyTorch/MKL/oneDNN/BLAS dependency, so those variables would
    # pin nothing -- adding them would be cargo cult, not determinism. The
    # variance classes, enumerated:
    #   - klayout's Python API: the checked generators reach their
    #     committed bytes through integer-dbu geometry and layer tables
    #     only -- no float kernels, no dispatch to vary.
    #   - native/ Rust crates: no runtime CPU dispatch exists -- no
    #     `std::arch`, no `is_x86_feature_detected`, no `target_feature`
    #     anywhere under native/*/src (verified when wiring #2275) -- and
    #     no generator's committed bytes flow through them anyway.
    #   - the one real class is host libm under the Python generators,
    #     which legitimately differs between a macOS laptop and an ubuntu
    #     runner (and across Python versions). That is handled
    #     structurally -- #2279's static float scan plus the
    #     `platform-variable` declaration -- not by env pinning, and it is
    #     invisible to this job's two same-host runs by construction.
    # The concrete host heterogeneity this job's results could see is the
    # runner-pool split (`[self-hosted, heavy]` vs `ubuntu-latest`); a
    # byte-exact numeric fixture evaluated for this repo must be judged
    # against THAT split (see docs/guides/golden-artifact-determinism.md,
    # "Flake triage", and docs/design/numeric-fixture-comparison-convention.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the primary copy
        uses: actions/checkout@v7
        with:
          path: primary

      - name: Check out a second copy at a different filesystem path
        # A different prefix AND a different path length: a generator that
        # embeds its own absolute path produces different bytes here, which
        # is precisely what the byte-compare below is looking for.
        uses: actions/checkout@v7
        with:
          path: second-checkout/nested/deeper-than-the-primary

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        # Only the primary checkout gets a venv. Each generator inserts its
        # OWN repo's `src/` at the front of sys.path (and the check exports a
        # matching PYTHONPATH), so the second checkout's generators import
        # the second checkout's code while sharing this interpreter --
        # a second `uv sync` would buy nothing but wall clock.
        working-directory: primary
        run: uv sync --locked --extra dev

      - name: Regenerate golden artifacts twice and byte-compare
        # The seeds are drawn randomly per run (distinct by construction) and
        # echoed in the report, so a failure is reproducible: re-run the
        # command locally with the two PYTHONHASHSEED values it printed.
        # Exit 1 = an artifact differed (the failure this job exists for);
        # exit 2 = the check could not run, which is also a red, never a
        # silent pass.
        #
        # --forensics-dir (issue #2275): on failure the check writes the
        # evidence pack -- both variants of every differing artifact, both
        # reports, and a rerun script with the exact seeds/checkouts -- to
        # the directory the next step uploads. Triage happens from that
        # evidence (inputs bit-identical? one green rerun at this head?)
        # BEFORE the code is blamed; see
        # docs/guides/golden-artifact-determinism.md, "Flake triage".
        working-directory: primary
        run: |
          uv run --frozen --extra dev python scripts/check_artifact_determinism.py \
            --checkout "$GITHUB_WORKSPACE/primary" \
            --checkout "$GITHUB_WORKSPACE/second-checkout/nested/deeper-than-the-primary" \
            --forensics-dir "$GITHUB_WORKSPACE/determinism-forensics" \
            --annotate

      - name: Upload failure forensics (artifact pairs + rerun recipe)
        # Issue #2275: a byte-compare failure must arrive with its own
        # evidence. The pack is written only on failure, so on a green run
        # this step is skipped (`if: failure()`) and the upload would find
        # no files anyway (`if-no-files-found: ignore` keeps a cannot-run
        # crash from failing the upload step on top of the real red).
        # retention-days matches the repo's other evidence artifacts
        # (design-agent-benchmark, kb-drift-canary).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-forensics
          path: determinism-forensics/
          retention-days: 90
          if-no-files-found: ignore

  wall-clock-budget:
    name: CI wall-clock budget
    # Issue #1971 measured CI wall clock across the 2AM Logic repos and found
    # that most of them are starved waiting on the `[self-hosted, heavy]` pool
    # rather than actually computing -- sky130-pll did 24s of work in 6.5
    # hours. THIS repo was the one exception: ~1000s of real summed job
    # seconds against 408s median / 782s max of run wall clock, i.e. already
    # parallelised. That makes klayout-tools the one repo where the work
    # itself has to shrink, and so the one repo where a compute regression is
    # worth gating on. Before this job nothing did: the per-job
    # `timeout-minutes` above are hard ceilings (the `test` matrix allows 45
    # minutes for a 3-minute job), so a leg could quietly triple and still be
    # green. See docs/guides/ci-wall-clock-budget.md.
    #
    # `needs:` every measured job so this runs last and sees their completed
    # timings; `if: always()` so a red run still gets its breakdown (a
    # slowdown that also breaks a test is exactly when you want the numbers).
    needs:
      - lint
      - native
      - native-statime
      - native-techmap
      - native-wave
      - signoff-example
      - site
      - test
      - test-numerical
      - action-smoke-test
      - artifact-determinism
    if: always()
    # Deliberately ubuntu-latest, never the heavy pool: a ~20s check that
    # measures queue contention must not queue behind it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The Actions API call below reads this run's own job timings.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Fetch this run's job and run timings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            > /tmp/ci-jobs.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /tmp/ci-run.json

      - name: Check wall-clock budget
        # --report-only for fork PRs: ci.yml's runner conditional routes those
        # to ubuntu-latest, whose per-job timings the budgets -- measured on
        # the self-hosted pool -- do not describe. A fixed threshold tuned
        # against self-hosted numbers would otherwise redden every fork PR.
        # Same-repo runs gate for real (exit 1 fails this job).
        #
        # No `uv sync`: the script is standard-library-only on purpose, so the
        # budget check does not become part of the cost it measures.
        run: |
          python3 scripts/check_ci_wall_clock.py \
            --jobs-json /tmp/ci-jobs.json \
            --run-json /tmp/ci-run.json \
            --budget .github/ci-wall-clock-budget.json \
            --annotate \
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '--report-only' || '' }}
