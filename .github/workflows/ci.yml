name: CI

# Green/red gate for every PR and every push to main: ruff lint + pytest.
# Everything here is headless — the KLayout Python module (`klayout.db` / `pya`)
# is used in batch mode only; nothing requires the KLayout GUI.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    # Both ruff steps below GATE — if either is red, run
    # `uv run --extra dev ruff format .` / `uv run --extra dev ruff check . --fix`
    # locally and commit the result. Do NOT add continue-on-error to either
    # step: it makes this job always green regardless of ruff's exit code,
    # which is exactly how a repo accumulates hundreds of unformatted files
    # behind a false-green check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails the job if uv.lock is stale relative to pyproject.toml.
        run: uv sync --locked --extra dev

      - name: ruff format --check
        # Scoped to first-party code by [tool.ruff.format] exclude in
        # pyproject.toml — vendored .loom/ and .claude/ trees are not governed.
        run: uv run --frozen --extra dev ruff format --check .

      - name: ruff check
        run: uv run --frozen --extra dev ruff check .

  native:
    name: Native engines (Rust)
    # `native/mom/` (issue #718) is this repo's first Rust component -- the
    # `klt_mom_native` pyo3 extension behind `klt mom`. Its numerics have
    # their own `cargo test` suite that the Python job never exercises, so it
    # gets its own job: fmt + clippy + unit tests, plus a real end-to-end
    # `klt mom` run through the built extension.
    #
    # No toolchain-install step: ubuntu-latest images ship a rustup-managed
    # stable Rust, so `cargo` is already on PATH (matching how this repo
    # avoids third-party actions elsewhere).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mom
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mom/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/mom/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # `--nocapture` so `solver::tests::iterative_solve_matches_direct_lu_solve`'s
        # printed convergence-rate report (issue #799's acceptance criterion
        # that the rate be *reported*, not only asserted) lands in this job's
        # log on a green run too, matching how the Python job already does
        # this for tests/test_mom_validation.py's convergence tables.
        run: cargo test -- --nocapture

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build + install the extension, then run the klt mom tests
        # `--group mom` resolves klt-mom-native from native/mom/ via
        # pyproject.toml's [tool.uv.sources] and drives maturin to compile it.
        # Without it, tests/test_mom.py and tests/test_mom_validation.py skip
        # themselves wholesale (by design, so a Rust-less environment degrades
        # gracefully) -- this job is what makes sure the skip is never the only
        # thing CI ever sees.
        #
        # tests/test_mom_ports_validation.py (issue #894, Phase 2b) is
        # listed explicitly for the same reason: it is what actually
        # exercises the "S-parameters match the closed-form reference"
        # acceptance criterion in CI rather than only locally.
        #
        # --capture=tee-sys so the closed-form comparison and
        # convergence-rate tables tests/test_mom_validation.py prints (issue
        # #719 requires the observed rate to be *reported*, not just asserted)
        # land in this job's log on a green run too, not only on failure. It
        # still captures, so test_mom.py's capsys-based CLI assertions are
        # unaffected -- unlike -s / --capture=no, which would break them.
        working-directory: .
        run: |
          uv sync --locked --extra dev --group mom
          uv run --frozen --extra dev --group mom pytest \
            tests/test_mom.py tests/test_mom_validation.py \
            tests/test_mom_ports_validation.py -v --capture=tee-sys

      - name: Assert the klt mom tests actually ran (no silent skip)
        working-directory: .
        run: |
          uv run --frozen --extra dev --group mom python -c "import klt_mom_native" || {
            echo "::error::klt_mom_native did not install -- tests/test_mom.py would have skipped"
            exit 1
          }

      - name: Cross-validate against the external FEM solver (issue #895)
        # `--extra mom-crossval` pulls in numpy/scikit-fem (a real,
        # independently-developed FEM library, see
        # scripts/research/mom_external_fem_crossval.py's docstring) so
        # tests/test_mom_external_fem_crossval.py always runs here rather
        # than silently skipping -- the same "never let the skip be the only
        # thing CI sees" discipline the step above enforces for
        # klt_mom_native. --capture=tee-sys so the S-parameter agreement
        # table lands in this job's log on a green run too, not just on
        # failure.
        working-directory: .
        run: |
          uv sync --locked --extra dev --extra mom-crossval --group mom
          uv run --frozen --extra dev --extra mom-crossval --group mom pytest \
            tests/test_mom_external_fem_crossval.py -v --capture=tee-sys

  native-congestion:
    name: Native engines (Rust) — congestion pre-check
    # `native/congestion/` (issue #785, Epic #700 Phase 1 §3.6) is this
    # repo's second Rust component -- the `klt_congestion_native` pyo3
    # extension behind the FLUTE/RUDY-family congestion pre-check research
    # spike. A separate job from `native` above (not folded into it) so a
    # failure here is attributable to this crate specifically, matching the
    # one-job-per-native-engine precedent that job's own comment sets.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/congestion
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/congestion/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/congestion/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build + install the extension, then run the congestion tests
        # `--group congestion` resolves klt-congestion-native from
        # native/congestion/ via pyproject.toml's [tool.uv.sources] and
        # drives maturin to compile it. Without it, tests/test_congestion.py's
        # native-extension-dependent tests skip themselves (by design) --
        # this job is what makes sure the skip is never the only thing CI
        # ever sees.
        working-directory: .
        run: |
          uv sync --locked --extra dev --group congestion
          uv run --frozen --extra dev --group congestion pytest \
            tests/test_congestion.py -v --capture=tee-sys

      - name: Assert the congestion tests actually ran (no silent skip)
        working-directory: .
        run: |
          uv run --frozen --extra dev --group congestion python -c "import klt_congestion_native" || {
            echo "::error::klt_congestion_native did not install -- tests/test_congestion.py would have skipped"
            exit 1
          }

  native-yield:
    name: Native engines (Rust) — yield statistics
    # `native/yield/` (issue #816, Phase 1a of the statistical/yield epic
    # #710) is this repo's third Rust component -- the `klt_yield_native`
    # pyo3 extension behind `klt yield`. Its own job, not folded into
    # `native` above, so a failure here is attributable to this crate
    # specifically -- the one-job-per-native-engine precedent that job's
    # comment sets.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/yield
    steps:
      - uses: actions/checkout@v7

      - name: cargo --version
        run: cargo --version && rustc --version

      - name: Cache cargo registry + build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/yield/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/yield/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        # GATES, like the ruff steps above -- do not add continue-on-error.
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # The statistics core's closed-form oracles (erfc against DLMF
        # values, Clopper-Pearson against directly-solved binomial tails, the
        # +/-2 sigma yield against erf(sqrt(2))) live here -- this step is
        # what keeps them honest.
        run: cargo test

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build + install the extension, then run the klt yield tests
        # `--group yield` resolves klt-yield-native from native/yield/ via
        # pyproject.toml's [tool.uv.sources] and drives maturin to compile
        # it. Without it, tests/test_yield.py's statistics tier skips itself
        # (by design, so a Rust-less environment degrades gracefully) --
        # this job is what makes sure the skip is never the only thing CI
        # ever sees.
        working-directory: .
        run: |
          uv sync --locked --extra dev --group yield
          uv run --frozen --extra dev --group yield pytest \
            tests/test_yield.py -v --capture=tee-sys

      - name: Assert the klt yield tests actually ran (no silent skip)
        working-directory: .
        run: |
          uv run --frozen --extra dev --group yield python -c "import klt_yield_native" || {
            echo "::error::klt_yield_native did not install -- tests/test_yield.py's statistics tier would have skipped"
            exit 1
          }

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml (requires-python).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (includes the klayout wheel)
        # --extra functional-verification pulls in the pinned cocotb (issue
        # #423, Phase 3 of Epic #391) -- a no-op on any interpreter >=3.14
        # per pyproject.toml's own marker (none in this job's matrix today,
        # but the resolver handles it correctly either way, verified while
        # developing this pin).
        run: uv sync --locked --extra dev --extra functional-verification

      - name: Install ngspice
        # klt sim (docs/cli/sim.md) invokes `ngspice -b` as a subprocess --
        # not a Python dependency, so it's installed here rather than via uv.
        # Package-manager install per the spike's "trivially CI-installable"
        # finding; tests skip gracefully (with a clear reason) if this binary
        # is ever absent, but CI always has it.
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Verify KLayout imports headlessly
        run: |
          uv run --frozen --extra dev python -c "
          import klayout.db as kdb
          print('klayout', kdb.Layout().dbu)
          "

      - name: Verify ngspice runs headlessly
        run: ngspice -v

      - name: Fetch real gallery-cell SPICE netlists
        # Pinned, checksum-verified per-file fetch (see the script's header
        # comment) -- small (~9 MB), unlike fetch-pdks.sh's lambdapdk. Backs
        # tests/test_gallery_signals.py's real-ngspice-against-a-real-cell
        # integration tests (issue #99); those tests skip gracefully (never
        # silently pass) if this step is ever unavailable, but CI always has it.
        run: scripts/fetch-cell-netlists.sh

      - name: Install Yosys build dependencies
        # scripts/install-yosys.sh builds Yosys from a pinned, checksum-
        # verified source release (issue #417) -- `apt-get install yosys`
        # would resolve Ubuntu 24.04's 0.33-5build2, ~30 releases stale
        # relative to the version docs/design/yosys-synthesis-spike.md's
        # worked example used (survey section 3.4). This installs the
        # from-source build's own prerequisites (CMake >= 3.28 already
        # ships on ubuntu-latest/noble); package-manager install, same
        # posture as the ngspice step above.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake bison flex libfl-dev libreadline-dev gawk tcl-dev \
            libffi-dev pkg-config zlib1g-dev

      - name: Cache pinned Yosys build
        id: yosys-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yosys-0.67
          key: yosys-0.67-${{ runner.os }}-${{ hashFiles('scripts/install-yosys.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Yosys (cache miss only)
        if: steps.yosys-cache.outputs.cache-hit != 'true'
        run: scripts/install-yosys.sh

      - name: Add pinned Yosys to PATH
        run: echo "$HOME/.cache/yosys-0.67/bin" >>"$GITHUB_PATH"

      - name: Verify Yosys runs headlessly
        run: yosys -V

      - name: Cache pinned sky130_fd_sc_hd liberty
        id: sky130-liberty-cache
        uses: actions/cache@v4
        with:
          path: pdks/sky130-liberty
          key: sky130-liberty-${{ hashFiles('scripts/fetch-sky130-liberty.sh') }}

      - name: Fetch sky130_fd_sc_hd liberty (tt_025C_1v80 corner)
        # A real, Yosys-parseable Liberty timing view for `klt synthesize`'s
        # GCD worked example (yosys-synthesis-spike.md section 4) -- pinned
        # to the exact volare/open_pdks build the spike itself used, one
        # file extracted (not the whole ~166 MB release asset). See the
        # script's header comment for why this can't come from
        # scripts/fetch-pdks.sh's lambdapdk payload.
        run: scripts/fetch-sky130-liberty.sh

      - name: Install Icarus Verilog + Verilator build dependencies
        # scripts/install-icarus-verilog.sh / scripts/install-verilator.sh
        # build both from pinned, checksum-verified source releases (issue
        # #423, Phase 3 of Epic #391) -- `apt-get install iverilog`/
        # `verilator` resolve Ubuntu 24.04's `12.0-2build2`/`5.020-1`,
        # respectively a full major version and 30 releases stale relative
        # to the exact versions
        # docs/design/cocotb-verification-spike.md's worked example (section
        # 6) was captured against (verified against
        # packages.ubuntu.com/noble). This installs the from-source builds'
        # own prerequisites; package-manager install, same posture as the
        # ngspice/Yosys steps above. `autoconf`/`help2man` back Verilator's
        # build specifically (its source tarball ships `configure.ac`, not a
        # pre-generated `configure`); `gperf` backs Icarus's own lexer
        # generation.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf autoconf help2man

      - name: Cache pinned Icarus Verilog build
        id: icarus-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/icarus-13.0
          key: icarus-13.0-${{ runner.os }}-${{ hashFiles('scripts/install-icarus-verilog.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Icarus Verilog (cache miss only)
        if: steps.icarus-cache.outputs.cache-hit != 'true'
        run: scripts/install-icarus-verilog.sh

      - name: Add pinned Icarus Verilog to PATH
        run: echo "$HOME/.cache/icarus-13.0/bin" >>"$GITHUB_PATH"

      - name: Verify Icarus Verilog runs headlessly
        run: iverilog -V

      - name: Cache pinned Verilator build
        id: verilator-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/verilator-5.050
          key: verilator-5.050-${{ runner.os }}-${{ hashFiles('scripts/install-verilator.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Verilator (cache miss only)
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        run: scripts/install-verilator.sh

      - name: Add pinned Verilator to PATH
        run: echo "$HOME/.cache/verilator-5.050/bin" >>"$GITHUB_PATH"

      - name: Verify Verilator runs headlessly
        run: verilator --version

      - name: pytest
        # GH_TOKEN backs tests/test_ingest_canary.py's real `gh api`
        # integration tests (issue #62's public-repo gate + full canary
        # ingest) -- the default automatic token, not a new secret. Its
        # cross-repo/cross-org reach is exactly the reach the gate itself
        # needs at ingest time: it can read public repos anywhere, but a
        # private repo in a different org (e.g. 2AMLogic/gf180-trng) 404s,
        # which is the fail-closed "refuse" behavior those tests assert.
        #
        # PDK_ROOT/PDK point at the sky130_fd_sc_hd liberty fetched above --
        # this is what lets
        # tests/test_synthesize.py::test_integration_real_yosys_gcd_worked_example
        # (previously skipped in CI, per that test module's own docstring)
        # run for real here: a real pinned Yosys binary on $PATH plus a
        # real sky130_fd_sc_hd liberty resolving via `list_pdks()`. Every
        # other test that resolves a PDK either isolates PDK_ROOT/PDK
        # itself (autouse fixtures across test_gen.py/test_gen_compose.py/
        # test_extract.py/test_pdk.py) or sets them explicitly via
        # monkeypatch before use (test_synthesize.py's own stubbed-Yosys
        # tests) -- these two job-level values are only ever observed by
        # code that does not already override them.
        #
        # The pinned cocotb/Icarus Verilog/Verilator versions provisioned
        # above are asserted for real here by
        # tests/test_functional_verification_toolchain_pins.py (issue #423)
        # -- a real `cocotb`/`iverilog`/`verilator` on $PATH means those
        # tests run their actual version-string assertion rather than
        # skipping, so a silent apt/pip resolution drift fails this job
        # loudly instead of quietly invalidating
        # docs/design/cocotb-verification-spike.md's captured worked-example
        # numbers.
        #
        # The same real toolchain also flips
        # tests/test_functional_verification.py's `@pytest.mark.skipif`-
        # guarded integration tier from skipped to real here (issue #423 AC
        # #3): the GCD worked example (spike section 6) runs through `klt
        # functional-verification` against both `engine: "icarus"` and
        # `engine: "verilator"`, asserting the exact `TESTS=3 PASS=2 FAIL=1
        # SKIP=0` outcome and (Verilator only) its line/toggle/branch/expr
        # coverage percentages, plus the `options.random_seed` end-to-end
        # pinning/echo tests (issue #423 AC #4) -- including that two runs of
        # the same seeded request reproduce identical `tests[]` content.
        run: uv run --frozen --extra dev --extra functional-verification pytest
        env:
          GH_TOKEN: ${{ github.token }}
          PDK_ROOT: ${{ github.workspace }}/pdks/sky130-liberty
          PDK: sky130A

      - name: klt kb validate
        # Belt-and-suspenders alongside tests/test_kb.py (which calls the same
        # kb.validate_entries() implementation): runs the actual shipped
        # `klt kb validate` entry point so a malformed kb/ entry breaks the
        # build the same way a real user invocation would surface it.
        run: uv run --frozen --extra dev klt kb validate --format json

  action-smoke-test:
    name: klt verify Action smoke test
    # Dogfoods action.yml (issue #268) against this repo's own fixtures on
    # every push/PR, so a broken action fails this repo's CI before it
    # breaks a downstream block repo's workflow -- see docs/guides/github-action.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare fixture block directories
        # `layout-metrics` expects a block *directory* (docs/cli/layout-metrics.md),
        # so each fixture GDS gets its own tiny directory named layout.gds.
        run: |
          mkdir -p /tmp/klt-fixtures/clean-block /tmp/klt-fixtures/violating-block
          cp tests/corpus/sky130/sky130_fd_sc_hd__inv_1.gds /tmp/klt-fixtures/clean-block/layout.gds
          cp examples/drc/example.gds /tmp/klt-fixtures/violating-block/layout.gds

      - name: klt verify -- clean layout (expect success)
        id: clean
        uses: ./
        with:
          layout: /tmp/klt-fixtures/clean-block/layout.gds
          block: /tmp/klt-fixtures/clean-block
          verbs: drc,layout-metrics,layers,render
          deck: sky130
          output-dir: klt-action-output/clean
          # Distinct artifact names per invocation: both clean and violating
          # steps upload in the same workflow run, so sharing the default
          # names would 409 on the second actions/upload-artifact call.
          json-artifact-name: klt-json-outputs-clean
          render-artifact-name: klt-render-clean

      - name: Assert clean-layout status is success
        run: |
          test "${{ steps.clean.outputs.status }}" = "success" || {
            echo "::error::expected status=success for the clean fixture, got '${{ steps.clean.outputs.status }}'"
            exit 1
          }

      - name: klt verify -- layout with seeded DRC violations (expect failure surfaced)
        # fail-on-findings: false so this step itself doesn't red the job --
        # the *next* step asserts the violation was actually detected and
        # reported, which is the behavior under test (issue #268's "verb
        # failure surfaces clearly, not silently" edge case).
        id: violating
        uses: ./
        with:
          layout: /tmp/klt-fixtures/violating-block/layout.gds
          verbs: drc
          deck: sky130
          output-dir: klt-action-output/violating
          fail-on-findings: false
          json-artifact-name: klt-json-outputs-violating
          render-artifact-name: klt-render-violating

      - name: Assert violating-layout status is failure
        run: |
          test "${{ steps.violating.outputs.status }}" = "failure" || {
            echo "::error::expected status=failure for the seeded-violation fixture, got '${{ steps.violating.outputs.status }}' -- violations were not surfaced"
            exit 1
          }
          grep -q "violations" "${{ steps.violating.outputs.summary-markdown-path }}" || {
            echo "::error::step summary markdown did not mention violations"
            exit 1
          }
