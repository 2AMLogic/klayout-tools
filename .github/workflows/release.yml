name: Release

# Cadence-gated patch releases on Loom's model (issue #5005; operator ruling
# r6-q22), replacing the weekly release-PR flow of #4920/#4921 -- GitHub
# Actions cannot open PRs here (#6897/#6911), so no release had been cut
# since v0.9.2 while `main` ran thousands of commits ahead.
#
#   bump          push to main (src/** only) / hourly schedule / dispatch:
#                 when scripts/version-bump-gate.sh says so, compute ONE
#                 patch bump of pyproject.toml's `base-version` plus the
#                 CHANGELOG.md release heading. No commit, no push.
#   publish-bump  the only job holding `id-token: write`: POST the two files
#                 to the fleet publisher
#                 (https://fleet-publish.2amlogic.com/v1/publish_version_bump),
#                 which commits them to main as
#                 `chore: bump version to X.Y.Z` under a fixed policy
#                 (exactly those two paths, one patch step, compare-and-swap
#                 on the parent we name). No direct push and no fallback.
#   tag           a green `CI` run for a push to this repo's main (Loom's
#                 `workflow_run` pattern): read the version THAT commit
#                 carries, and when it is unreleased tag `vX.Y.Z` on it and
#                 dispatch publish.yml on the tag ref.
#
# Generated files are NOT part of the bump commit (the publisher accepts
# exactly pyproject.toml + CHANGELOG.md): the deck history is generated from
# the real tag into $RUNNER_TEMP and force-included into wheel and sdist by
# hatch_build.py (KLT_DECK_HISTORY_PATH), and site/src/data/cli.generated.json
# is regenerated by the site deploy. See RELEASING.md.
#
# Self-trigger note: the publisher's App commits DO trigger workflows, so the
# push trigger's `paths:` filter is the loop guard -- it lists `src/**` only,
# while the bump commit touches only pyproject.toml and CHANGELOG.md.
# pyproject.toml is nonetheless a release path for the gate (a dependency
# change is release-worthy, operator ruling r6-q22); the hourly schedule
# catches those without ever matching the bump commit itself.
#
# Token caveats (RELEASING.md): a tag pushed with the default GITHUB_TOKEN
# does not fire publish.yml's `push: tags` trigger, so the tag job dispatches
# publish.yml explicitly on the tag ref.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  # Hourly, not daily: against a 24 h window that started at an arbitrary
  # time, a once-a-day cron can push the catch-up out to ~48 h. Hourly bounds
  # the worst case at RELEASE_MIN_INTERVAL + ~1 h; each run is a seconds-long
  # gate check that also picks up pyproject-only changes (see above).
  schedule:
    - cron: "53 * * * *"
  # The tag job's trigger: a completed `CI` run. `branches` filters on the CI
  # run's head branch; the conclusion/event/repository guards live in the
  # tag job's `if:` (a workflow_run fires for every completion, red or
  # green). The bump jobs are gated off this event below -- the publisher's
  # OIDC pins name push/schedule/workflow_dispatch only, and a bump decision
  # is never taken from a workflow_run context.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version instead of the next patch (a minor is deliberate; the fleet publisher refuses it until a reviewed 2am change lists it)"
        type: string
        default: ""
      force:
        description: "Bump now, skipping the release interval (operator hotfix path)"
        type: boolean
        default: false
      reason:
        description: "Why the bump is forced (required with force/version; recorded in the bump commit)"
        type: string
        default: ""

# Serialize runs instead of racing them -- deliberately NOT cancel-in-progress:
# a queued run re-checks the gate against whatever `main` looks like when it
# starts (which already includes any earlier run's bump commit, so it defers
# instead of bumping twice). The tag runs get their own regimes: eligible
# green-main completions serialize in one group (a burst of green runs yields
# at most one running plus the newest pending, whose version subsumes the
# cancelled ones); ineligible completions (red/cancelled CI, PR or fork runs)
# get a unique group so they never displace an eligible pending run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run'
        && (github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
            && github.event.workflow_run.head_branch == 'main'
            && github.event.workflow_run.head_repository.full_name == github.repository
            && 'tag-main' || format('tag-ineligible-{0}', github.run_id))
        || 'bump' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Computes the bump; publishes nothing and holds no id-token. Its outputs
  # are the gate's verdict, the main SHA the bump was computed on, the new
  # version and the bump itself as a gzip+base64 `git diff` of the two files
  # (a few KB; the publish job re-applies it to the same files).
  bump:
    name: Compute the version bump (at most once per release interval)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      parent: ${{ steps.bump.outputs.parent }}
      version: ${{ steps.bump.outputs.version }}
      patch: ${{ steps.bump.outputs.patch }}
    steps:
      # No `ref:`/pinned sha here -- always check out the CURRENT tip of
      # `main` at run start. For a queued run that matters: it must bump from
      # wherever `main` actually is now, not from the commit that originally
      # triggered it. Full commit history (trees, no blobs): the gate looks
      # up the last bump, which after a quiet stretch can be weeks back, and
      # refuses a shallow clone outright. Nothing in this job pushes, so the
      # read-only token is not persisted either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Before any mutation. Exit 0 with decision=deferred/nothing leaves the
      # version alone; an unreadable history or a bad RELEASE_MIN_INTERVAL
      # fails red (never "always bump", never a silent stop). inputs reach
      # the shell only through env:, never as an expression inside run:
      # (template injection). A `version` dispatch is as deliberate as a
      # forced one, so it skips the interval too -- with a synthesized reason.
      - name: Release cadence gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true || inputs.version != '') }}
          FORCE_REASON: ${{ inputs.force == true && inputs.reason || format('version override to {0}', inputs.version) }}
          ACTOR: ${{ github.triggering_actor }}
          RELEASE_MIN_INTERVAL: ${{ vars.RELEASE_MIN_INTERVAL }}
        run: |
          set -euo pipefail
          # Capture the exit code instead of letting set -e end the step at
          # the assignment: the gate prints decision=error/reason=... to
          # stdout on failure, and that reason must reach the log and job
          # summary.
          rc=0
          out="$(bash scripts/version-bump-gate.sh --event "$EVENT_NAME" --force "$FORCE" \
            --reason "$FORCE_REASON" --actor "$ACTOR" --ref origin/main)" || rc=$?
          echo "$out"
          decision="$(sed -n 's/^decision=//p' <<<"$out")"
          reason="$(sed -n 's/^reason=//p' <<<"$out")"
          echo "decision=$decision" >>"$GITHUB_OUTPUT"
          {
            echo "### Version bump gate: ${decision}"
            echo ""
            echo "$reason"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # scripts/release_prep.py does the two text edits (base-version patch
      # step, or the --version override forwarded verbatim; the CHANGELOG
      # release heading). python3 only -- no toolchain, no lockfile regen
      # (uv.lock records no version for this dynamic-version project).
      # Nothing is committed: the publisher builds the commit from the files.
      - name: Compute the version bump (no commit, no push)
        id: bump
        if: steps.gate.outputs.decision == 'bump'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The only paths the publisher accepts.
          files=(pyproject.toml CHANGELOG.md)

          parent="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" != "$parent" ]; then
            echo "ERROR: checkout HEAD is not origin/main ($parent); refusing to compute a bump on another commit." >&2
            exit 1
          fi

          args=()
          if [ -n "$INPUT_VERSION" ]; then args+=(--version "$INPUT_VERSION"); fi
          info="$(python3 -I scripts/release_prep.py --repo . prepare "${args[@]}")"
          version="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["version"])' "$info")"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi

          # The bump may change the version files and nothing else: anything
          # else would be silently dropped from the published commit.
          stray="$(git status --porcelain --untracked-files=all -- . \
            | cut -c4- | grep -vxF -f <(printf '%s\n' "${files[@]}") || true)"
          if [ -n "$stray" ]; then
            echo "ERROR: the bump changed files outside the version set:" >&2
            echo "$stray" >&2
            exit 1
          fi

          patch="$(git diff --binary HEAD -- "${files[@]}" | gzip -9n | base64 -w0)"
          {
            echo "parent=$parent"
            echo "version=$version"
            echo "patch=$patch"
          } >>"$GITHUB_OUTPUT"
          echo "Computed bump to $version on $parent" | tee -a "$GITHUB_STEP_SUMMARY"

  # Publishes the bump through the fleet publisher. `id-token: write` lives
  # here and only here, and this job runs no action (no `uses:`): every step
  # of a job that may mint an OIDC token could mint one, so the only code in
  # it is this file's shell, the repo's own gate script, git, curl and jq.
  publish-bump:
    name: Publish the bump through fleet-publish (never a direct push)
    needs: bump
    if: needs.bump.outputs.decision == 'bump'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish version bump (re-checks the gate on the current tip)
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true || inputs.version != '') }}
          FORCE_REASON: ${{ inputs.force == true && inputs.reason || format('version override to {0}', inputs.version) }}
          ACTOR: ${{ github.triggering_actor }}
          RELEASE_MIN_INTERVAL: ${{ vars.RELEASE_MIN_INTERVAL }}
          BUMP_PARENT: ${{ needs.bump.outputs.parent }}
          BUMP_VERSION: ${{ needs.bump.outputs.version }}
          BUMP_PATCH: ${{ needs.bump.outputs.patch }}
          PUBLISH_URL: https://fleet-publish.2amlogic.com/v1/publish_version_bump
        run: |
          set -euo pipefail

          die() {
            echo "ERROR: $*" >&2
            echo "**Version bump not published:** $*" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # The publisher pins ref refs/heads/main; say so here rather than
          # as a 403 wrong_ref after the work.
          [ "$GITHUB_REF" = "refs/heads/main" ] || die "runs only on refs/heads/main (got $GITHUB_REF)"

          files=(pyproject.toml CHANGELOG.md)

          work="$RUNNER_TEMP/publish"
          mkdir -p "$work"
          printf '%s' "$BUMP_PATCH" | base64 -d | gunzip >"$work/bump.patch"

          # Plain git, no action: this repo is public, so the read needs no
          # credential. Full history, no blobs, for the gate; the working
          # tree is only the gate script and the two version files.
          git clone --quiet --filter=blob:none --no-checkout --branch main \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$work/repo"
          cd "$work/repo"
          git sparse-checkout set --no-cone /scripts/version-bump-gate.sh "${files[@]/#//}"

          message="chore: bump version to $BUMP_VERSION"
          if [ "$FORCE" = "true" ]; then
            message+=$'\n\n'"Forced-by: $ACTOR"$'\n\n'"Reason: $FORCE_REASON"
          fi

          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            # Re-read main every attempt: after a 409 head_moved or an
            # ambiguous outcome the publisher expects us to decide again.
            git fetch --quiet origin main
            git checkout --quiet -f -B main origin/main
            head="$(git rev-parse origin/main)"

            # Re-check the gate against the current tip: a bump that landed
            # meanwhile (ours after an ambiguous outcome, a forced dispatch,
            # a queued run) makes this run stop rather than bump twice.
            gate_rc=0
            gate="$(bash scripts/version-bump-gate.sh --event "$EVENT_NAME" --force "$FORCE" \
              --reason "$FORCE_REASON" --actor "$ACTOR" --ref origin/main)" || gate_rc=$?
            if [ "$gate_rc" -ne 0 ]; then
              echo "$gate"
              echo "Gate re-check failed (exit $gate_rc) on the current tip:" >>"$GITHUB_STEP_SUMMARY"
              echo "$gate" >>"$GITHUB_STEP_SUMMARY"
              exit "$gate_rc"
            fi
            if ! grep -qx 'decision=bump' <<<"$gate"; then
              echo "$gate"
              if [ "$(grep -E '^base-version' pyproject.toml | head -1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')" = "$BUMP_VERSION" ]; then
                echo "main is already at $BUMP_VERSION (an earlier attempt landed) -- done." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "Gate no longer says bump on the current tip -- not bumping." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi

            # The bump was computed on BUMP_PARENT. If main has moved but no
            # version file changed, the same bump IS the bump of the new tip
            # (byte-identical inputs), so it is sent with the new tip as its
            # parent. If a version file changed, the bump has to be
            # recomputed, which this job deliberately cannot do.
            parent="$BUMP_PARENT"
            if [ "$head" != "$BUMP_PARENT" ]; then
              if git diff --quiet "$BUMP_PARENT" "$head" -- "${files[@]}"; then
                parent="$head"
              elif [ "$FORCE" = "true" ]; then
                die "a version file changed on main since the bump was computed; dispatch the forced bump again"
              else
                echo "A version file changed on main since the bump was computed -- not publishing; the next run (push or the hourly schedule) recomputes it." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            git apply "$work/bump.patch"
            [ "$(grep -E '^base-version' pyproject.toml | head -1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')" = "$BUMP_VERSION" ] \
              || die "the applied bump does not set base-version to $BUMP_VERSION"

            # The request: only the files the bump changed (the publisher
            # refuses an unchanged one), each base64-encoded from disk.
            changed=()
            while IFS= read -r path; do changed+=("$path"); done \
              < <(git diff --name-only HEAD -- "${files[@]}")
            : >"$work/files.jsonl"
            for path in "${changed[@]}"; do
              base64 -w0 "$path" >"$work/content.b64"
              jq -cn --arg path "$path" --rawfile b64 "$work/content.b64" \
                '{path: $path, content_b64: $b64}' >>"$work/files.jsonl"
            done
            jq -n --arg parent "$parent" --arg version "$BUMP_VERSION" --arg message "$message" \
              --slurpfile files "$work/files.jsonl" \
              '{parent: $parent, version: $version, message: $message, files: $files}' >"$work/body.json"

            # A fresh OIDC token per attempt (they are short-lived). Both
            # bearer values travel to curl on stdin (--config -), never argv.
            oidc="$(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              | curl -sS --fail --max-time 30 --config - \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://fleet-publish.2amlogic.com" \
              | jq -r '.value // empty')" || oidc=""
            [ -n "$oidc" ] || die "could not mint a GitHub Actions OIDC token (is id-token: write granted?)"
            echo "::add-mask::$oidc"

            rm -f "$work/response.json"
            code="$(printf 'header = "Authorization: Bearer %s"\n' "$oidc" \
              | curl -sS --max-time 90 --config - -X POST \
                  -H 'Content-Type: application/json' \
                  --data-binary "@$work/body.json" \
                  -o "$work/response.json" -w '%{http_code}' \
                  "$PUBLISH_URL")" || code="000"
            unset oidc

            error="$(jq -r '.error // empty' "$work/response.json" 2>/dev/null || true)"
            reason="$(jq -r '.reason // empty' "$work/response.json" 2>/dev/null || true)"
            request_id="$(jq -r '.request_id // empty' "$work/response.json" 2>/dev/null || true)"
            outcome="HTTP $code ${error:-no error code}${reason:+ ($reason)}${request_id:+ request_id=$request_id}"

            case "$code:$error" in
              200:*)
                commit="$(jq -r '.commit' "$work/response.json")"
                reconciled="$(jq -r '.reconciled' "$work/response.json")"
                echo "Published version bump to $BUMP_VERSION: $commit (parent $parent, reconciled=$reconciled)" \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              # Main moved under the compare-and-swap, or the outcome is
              # unknown (the bump may have landed): re-read main and decide
              # again, as the publisher asks.
              409:* | 503:upstream_ambiguous | 000:*)
                echo "Attempt $attempt/$attempts: $outcome -- re-reading main" >&2
                ;;
              # Transient, nothing written.
              502:upstream_error | 503:oidc_unavailable | 429:*)
                echo "Attempt $attempt/$attempts: $outcome -- retrying" >&2
                ;;
              *)
                die "the publisher refused the bump: $outcome"
                ;;
            esac
            sleep $((attempt * 5))
          done

          die "no publish after $attempts attempts -- main kept moving or the publisher kept failing"

  # Tag a GREEN main commit carrying an unreleased version (Loom's #10826
  # pattern): a red bump is never tagged; its version ships later, from the
  # first later commit with the same base-version that goes green.
  tag:
    name: Tag a green main commit and dispatch publish
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag lands on the CI-tested commit, read via $HEAD_SHA below
          # (never github.sha: in a workflow_run run that is main's CURRENT
          # tip, not the tested one). Full history + tags: ancestry checks.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Resolve the release this green commit carries
        id: resolve
        run: |
          set -euo pipefail
          echo "version=" >>"$GITHUB_OUTPUT"

          # Still on main? (A reverted/rewritten commit's late CI run is not
          # released; non-fast-forward is ruleset-blocked, but check anyway.)
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "$HEAD_SHA is no longer on main; not tagging." ; exit 0
          fi

          version="$(git show "$HEAD_SHA":pyproject.toml | grep -E '^base-version' | head -1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; not tagging." ; exit 0
          fi
          # A newer tag already cut (this commit's version went stale: its
          # own CI was red, a later bump got tagged first): never go backwards.
          newest="$(git tag --sort=-v:refname --list 'v*' | head -1)"
          if [ -n "$newest" ] && [ "$newest" != "$tag" ]; then
            oldest_first="$(printf '%s\n%s\n' "${newest#v}" "$version" | sort -V | head -1)"
            if [ "$oldest_first" = "$version" ]; then
              echo "A newer release $newest exists; $version went stale, not tagging it." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Gate on native extras
        id: native
        if: steps.resolve.outputs.version != ''
        run: |
          set -euo pipefail
          status=0
          uv run --python 3.12 --no-project python scripts/check_native_extras.py \
            > "$RUNNER_TEMP/native.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/native.log"
          echo "ok=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report blocked release (single tracking issue)
        if: steps.native.outputs.ok == 'false'
        run: |
          set -euo pipefail
          title="Automated release blocked: klt-*-native pin not published"
          body="$(printf 'The tag job refused to tag v%s (no tag, no publish).\n\nRun: %s/%s/actions/runs/%s\n\n```\n%s\n```\n\nPublish the pin (docs/releasing-native.md), then re-run the Release workflow; this issue is refreshed in place, not re-filed.' \
            "${{ steps.resolve.outputs.version }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -n 40 "$RUNNER_TEMP/native.log")")"
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          exit 1

      - name: Tag the green commit and dispatch publish
        if: steps.native.outputs.ok == 'true'
        run: |
          set -euo pipefail
          v="v${{ steps.resolve.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Release ${v#v}" "$HEAD_SHA"
          git push origin "refs/tags/$v"
          # GITHUB_TOKEN tag pushes do not trigger publish.yml's `push: tags`;
          # workflow_dispatch on the tag ref does, and builds from the tag.
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$v"
