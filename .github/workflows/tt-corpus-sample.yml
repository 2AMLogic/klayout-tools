name: Tiny Tapeout DRC sample

# AC2 of #5084: run on every PR so a corpus regression fails that build.
# Two operator-named designs; PAL is actually 1x2 in the pinned live index.
# Budget: measured 3.1 minutes DRC, bounded to 5 minutes per design; 15 minutes
# includes dependency install and paced network fetch. No extract/LVS (#5893).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tt-drc-sample:
    name: Pinned gf180mcuD DRC sample
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the checkout and headless KLayout wheel
        run: uv sync --locked

      - name: Fetch pinned sample and require clean DRC for every design
        run: uv run --frozen python scripts/tt_corpus_sample.py

      - name: Upload provenance, per-design times, and DRC envelopes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tt-gf0p2-drc-sample
          path: |
            .cache/tt-drc-sample/fetch.json
            .cache/tt-drc-sample/run.json
            .cache/tt-drc-sample/cache/manifests/
            .cache/tt-drc-sample/results/**/*.json
          if-no-files-found: error
