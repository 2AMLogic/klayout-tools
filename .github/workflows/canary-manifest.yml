# Check for public canary repositories appearing or disappearing between changes
# to the manifest (#7876). An operator can rerun the check after a repair.
name: Canary inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read

concurrency:
  group: canary-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keep this check from saving another uv cache alongside main CI.
          enable-cache: false
      - name: Canary manifest matches the forge
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-canary-manifest.sh
