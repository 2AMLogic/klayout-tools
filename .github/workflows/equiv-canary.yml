name: Real-P&R sequential-equivalence canary

# Epic #707 Phase 3 (issue #1324): a manually-triggered, CI-runnable execution
# path for the real pre/post-route sequential-equivalence canary --
# `tests/test_equiv.py::test_sequential_engine_real_pnr_register_preserving_transformation`.
# That test runs `klt synthesize` -> `klt place-and-route` (real `openroad`
# engine, GCD worked example) and proves `klt equiv`'s `"yosys-sequential"`
# engine finds the pre-route and post-route netlists `"equivalent"` -- the
# direct, real-P&R validation issue #1313's own acceptance criteria required
# (evidenced once, manually, by issue #1323). Before this workflow existed,
# re-running that proof required a manual local `openroad`/sky130 PDK setup;
# this job automates that setup so the canary is durable, repeatable
# evidence rather than a one-off manual run.
#
# Provisioning is deliberately NOT reinvented here: OpenROAD/PDK provisioning
# is epic #700's (place-and-route's) infrastructure concern. This job copies
# the exact same steps -- pinned Yosys build+cache, volare + the same pinned
# full sky130A PDK commit, and the `openroad` Docker wrapper via
# `scripts/install-openroad-docker.sh` -- that
# `.github/workflows/place-and-route-smoke.yml` already established and
# documents in `docs/cli/place-and-route.md`'s "Installing OpenROAD"/"CI"
# sections. See that workflow's own header comment for the underlying
# rationale.
#
# `workflow_dispatch` only, for the identical reason
# `place-and-route-smoke.yml` is: this job pulls a large `openroad/orfs:latest`
# Docker image and fetches a full open_pdks-layout sky130A PDK, multi-GB of
# one-time cost on a cache miss -- judged too heavy to gate every PR (and
# `test_equiv.py`'s own `HAVE_YOSYS`/`openroad`/PDK `skipif` guards mean this
# test never runs, and is silently skipped, in the ordinary `ci.yml` `test`
# job). Trigger manually from the Actions tab, or `gh workflow run
# equiv-canary.yml`, whenever `klt equiv`'s `"yosys-sequential"` engine,
# `klt synthesize`, or `klt place-and-route` change, or before a release.
# See `docs/cli/equiv.md` for how this canary's result is used as evidence.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equiv-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  equiv-canary:
    name: Real pre/post-route sequential-equivalence canary (gcd)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        run: uv sync --locked --extra dev

      - name: Verify KLayout imports headlessly
        run: |
          uv run --frozen --extra dev python -c "
          import klayout.db as kdb
          print('klayout', kdb.Layout().dbu)
          "

      - name: Install Yosys build dependencies
        # Mirrors .github/workflows/ci.yml's `test` job / place-and-route-smoke.yml's
        # step of the same name -- see either for the per-package rationale
        # and the apt-mirror-stall history behind the timeout/retry wrapper.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          CI_APT_DEADLINE: "270"
          CI_APT_PER_CMD_TIMEOUT: "150"
        run: |
          scripts/ci-apt-install.sh \
            cmake bison flex libfl-dev libreadline-dev gawk tcl-dev \
            libffi-dev pkg-config zlib1g-dev

      - name: Cache pinned Yosys build
        id: yosys-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/yosys-0.67
          key: yosys-0.67-${{ runner.os }}-${{ hashFiles('scripts/install-yosys.sh', 'scripts/_install_common.sh') }}

      - name: Build + install pinned Yosys (cache miss only)
        if: steps.yosys-cache.outputs.cache-hit != 'true'
        run: scripts/install-yosys.sh

      - name: Add pinned Yosys to PATH
        run: echo "$HOME/.cache/yosys-0.67/bin" >>"$GITHUB_PATH"

      - name: Verify Yosys runs headlessly
        run: yosys -V

      - name: Install volare
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user volare
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Cache full sky130A PDK (volare, pinned)
        id: pdk-cache
        uses: actions/cache@v6
        with:
          path: .pdk-cache
          # Same pinned open_pdks build place-and-route-smoke.yml pins, reused
          # here for reproducibility rather than "whatever volare's latest is
          # at run time".
          key: sky130A-pdk-c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Fetch full sky130A PDK (volare, cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          PDK_ROOT="${{ github.workspace }}/.pdk-cache" \
            volare enable --pdk sky130 c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Install the openroad Docker wrapper
        # scripts/install-openroad-docker.sh (issue #1328) -- pulls
        # `openroad/orfs:latest` and writes a wrapper script that shells out
        # to it per invocation, mirroring docs/cli/place-and-route.md's
        # documented recipe. GitHub-hosted `ubuntu-latest` runners ship
        # Docker preinstalled, so no separate Docker setup step is needed.
        timeout-minutes: 15
        run: |
          mkdir -p "$HOME/.cache/openroad-docker/bin"
          scripts/install-openroad-docker.sh "$HOME/.cache/openroad-docker/bin"
          echo "$HOME/.cache/openroad-docker/bin" >>"$GITHUB_PATH"

      - name: Run the real pre/post-route sequential-equivalence canary (gcd)
        env:
          PDK: sky130A
          PDK_ROOT: ${{ github.workspace }}/.pdk-cache
        run: |
          uv run --frozen --extra dev pytest tests/test_equiv.py \
            -k test_sequential_engine_real_pnr_register_preserving_transformation \
            -v -rs | tee pytest-equiv-canary.log

      - name: Confirm the canary ran to completion, not skipped
        # pytest's own exit code already fails the job on an assertion
        # failure or error, but a *skip* exits 0 by default -- and this
        # canary's `skipif` guards (HAVE_YOSYS / `openroad` on PATH / a real
        # sky130 PDK resolving via `list_pdks()`) should all resolve false
        # once the steps above provision them. Belt-and-suspenders: grep the
        # `-rs` short-skip-summary this job's pytest step already requested
        # and fail explicitly if the canary was skipped anyway, matching
        # issue #1323's "confirmed not SKIPPED" evidence bar. The `-k`
        # filter above selects exactly one test (verified by
        # `--collect-only` in this issue's PR), so any "SKIPPED"/"skipped"
        # in the log unambiguously refers to *this* canary, not some other
        # test.
        run: |
          if grep -Eq "^SKIPPED \[|[0-9]+ skipped" pytest-equiv-canary.log; then
            echo "::error::Canary test was SKIPPED, not run -- provisioning did not satisfy its skipif guards." >&2
            exit 1
          fi
          echo "Canary ran to completion (not skipped)."
