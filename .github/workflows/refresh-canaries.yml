name: Refresh canary blocks

# Issue #4565: `blocks/canaries.json` is the single source of truth for which
# public canary repos the klayout-tools.org gallery presents. Issue #7882: this
# job also runs daily, because the manifest drifts when *other* repositories
# change visibility or a new `<pdk>-*` canary repo appears -- drift that arrives
# with no commit attached, and that the scheduled `canary-manifest.yml` check
# can only report as a red run nobody reads.
#
# Each run (daily, or Actions -> "Refresh canary blocks" -> Run workflow):
#   1. `scripts/ingest-canary.py --sync-manifest` rewrites blocks/canaries.json
#      to the forge's current set of public canary repos (adds a new public
#      repo with `ref: null`, drops one that is no longer public, keeps pins).
#   2. `scripts/ingest-canary.py --manifest` re-ingests every listed entry.
#   3. If `blocks/` changed, the diff goes up as a PR on ONE stable branch
#      (`auto/refresh-canaries`); a later run force-pushes that branch, so an
#      unmerged drift PR is updated in place, never joined by a new one. Do not
#      push to that branch by hand -- the next run replaces it.
# No drift means no branch, no PR, and a green run. The job never pushes to
# main: a human reviews and merges the PR, and `deploy-site.yml` redeploys when
# it merges.
#
# Ingestion is fail-closed on repo visibility (`assert_public_repo()`), so a
# manifest entry that is not public is reported and skipped, and the job
# fails after opening any PR for the entries that did succeed. A failed sync or
# a failed ingest entry keeps the run red (never silently green), as does a
# failed PR step -- for example when the repository setting "Allow GitHub
# Actions to create and approve pull requests" is off.
#
# Content rules: blocks/README.md "Adding a canary / what the site shows".
# A PR opened with the default GITHUB_TOKEN does not itself trigger other
# workflows; a reviewer can close/reopen it to run CI.

on:
  workflow_dispatch:
  schedule:
    # Off-peak, and not 05:43 (canary-manifest.yml's read-only drift check).
    - cron: "17 7 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-canaries
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync manifest, re-ingest canaries and open a PR on change
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (includes the klayout wheel)
        run: uv sync --locked --extra dev

      - name: Sync manifest to the forge
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        # `--sync-manifest` is the only verb that edits the manifest; the
        # ingest below only reads it. A failure here (e.g. `gh repo list`)
        # leaves the manifest untouched, so the ingest still runs for the
        # listed entries; the failure is re-raised in the last step.
        run: |
          set +e
          uv run --frozen --extra dev python scripts/ingest-canary.py \
            --sync-manifest
          echo "rc=$?" >>"$GITHUB_OUTPUT"

      - name: Ingest manifest
        id: ingest
        env:
          GH_TOKEN: ${{ github.token }}
        # Don't abort on a failing entry: the others' diff should still land.
        # The failure is re-raised in the last step.
        run: |
          set +e
          uv run --frozen --extra dev python scripts/ingest-canary.py \
            --manifest blocks/canaries.json
          echo "rc=$?" >>"$GITHUB_OUTPUT"

      - name: Open PR if blocks/ changed
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$(git status --porcelain -- blocks/)" ]; then
            echo "No blocks/ changes; nothing to do."
            exit 0
          fi
          # One stable branch, never a dated one: an unmerged drift PR must be
          # updated in place, not followed by a new branch and PR every day.
          branch="auto/refresh-canaries"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add blocks/
          git commit -m "chore(blocks): sync canary manifest and blocks with the forge"
          # A fresh checkout has no remote-tracking ref for the branch, so
          # fetch it first (absent on the first drifting day: ignored) or the
          # lease would reject the update of yesterday's still-open branch.
          git fetch --no-tags origin \
            "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(blocks): sync canary manifest and blocks with the forge" \
              --body "Re-sync of \`blocks/canaries.json\` with the public 2AMLogic canary repos (\`scripts/ingest-canary.py --sync-manifest\`) followed by a re-ingest of every entry (\`--manifest\`); triggered by \`$TRIGGER\`. Review the \`blocks/\` diff; merging redeploys the site. A dropped manifest entry means that repo is no longer public, but this job does **not** delete its \`blocks/<slug>/\` directory, and the site serves every directory under \`blocks/\` -- remove it in a follow-up if it should come down. Do not push to this branch: the next run force-pushes it, so one open PR tracks the current drift. Content rules: blocks/README.md."
          else
            echo "An open PR already tracks $branch; the force-push updated it in place."
          fi

      - name: Fail if the sync or any manifest entry failed
        if: steps.sync.outputs.rc != '0' || steps.ingest.outputs.rc != '0'
        run: |
          echo "The manifest sync or one or more manifest entries failed; see the 'Sync manifest to the forge' and 'Ingest manifest' steps."
          exit 1
