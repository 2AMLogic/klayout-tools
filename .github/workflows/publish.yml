name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Dispatched by release.yml (issue #4920): a tag pushed with the default
  # GITHUB_TOKEN does not fire the `push: tags` trigger above, but a
  # `workflow_dispatch` made with that token does. Dispatch on the tag ref, so
  # the run is still this workflow at top level (PyPI trusted publishing is
  # registered against `publish.yml` + environment `pypi`).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      # A dispatch from a branch would build a `.dev` version (issue #4920);
      # only a tag ref may build, and so publish, a release.
      - name: Require a release tag ref
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::publish.yml must run on a v* tag ref, got $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags: `hatch_build.py` records the built commit's
          # tag state into the distribution so `klt --version` can report a
          # bare `X.Y.Z` for a real release and `X.Y.Z+g<sha>` for anything
          # else (issue #1202). A checkout that cannot see the tag would ship
          # a release wheel labelled as a non-release build.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.10"

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  check-native-extras:
    name: Check klt-*-native extra pins
    runs-on: ubuntu-24.04
    # Repo code runs here, so keep it out of the privileged `publish` job:
    # read-only token, no `pypi` environment, no OIDC, no persisted credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      # Issue #2900: v0.6.0/v0.7.0 shipped a `[yield]` extra pinning
      # klt-yield-native before it was on PyPI. Fail the release instead.
      - name: Check klt-*-native extra pins are published
        run: uv run --python 3.12 --no-project python scripts/check_native_extras.py

  publish:
    name: Publish to PyPI
    needs: [build, check-native-extras]
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Publish to PyPI
        run: uv publish
