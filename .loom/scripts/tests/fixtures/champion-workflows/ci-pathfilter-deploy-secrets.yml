# Synthetic reduction of example-org/tool-repo#202 (2026-11-20): the workflow's
# path filters and step names contain the literal text "secrets.", which the
# pre-#14915 line-regex head-contents check matched as a secret reference.
# Nothing here is an evaluated ${{ secrets.* }} expression. Path-only case.
name: infra-ops-go
on:
  pull_request:
    paths:
      - 'scripts/deploy_secrets.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test  # runs the deploy_secrets.py fixtures first
